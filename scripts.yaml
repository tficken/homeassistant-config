all_lights_off:
  alias: All lights off
  sequence:
    - action: light.turn_off
      target:
        entity_id: all
      data:
        transition: 2
  mode: single
  icon: mdi:lightbulb-off

goodnight:
  alias: Goodnight
  sequence:
    - action: script.goodnight_door_check
    - action: script.goodnight_dim_lights
    - action: media_player.media_stop
      target:
        entity_id: all
      continue_on_error: true
    - action: media_player.volume_set
      target:
        entity_id: media_player.master_bedroom_echo_dot
      data:
        volume_level: 0.2
      continue_on_error: true
    - action: media_player.play_media
      target:
        entity_id: media_player.master_bedroom_echo_dot
      data:
        media_content_id: "https://files.noise-foundation.com/brown-noise-528-8h-v2.mp3"
        media_content_type: audio/mpeg
      continue_on_error: true
    - action: script.goodnight_enable_security
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Goodnight
        message: Security armed and brown noise playing. Sleep well.
      continue_on_error: true
  mode: single
  icon: mdi:weather-night

restart_ha:
  alias: Restart Home Assistant
  sequence:
    - action: homeassistant.restart
  mode: single
  icon: mdi:restart

movie_mode:
  alias: Movie mode
  sequence:
    - action: light.turn_off
      target:
        area_id: travis_office
      data:
        transition: 3
    # Chamber lights may not be in the office area (folded in from the retired scene)
    - action: light.turn_off
      target:
        entity_id:
          - light.p1s_01p00a412300832_chamber_light
          - light.travis_office_p1s_uno_chamber_light
      continue_on_error: true
    - action: media_player.media_pause
      target:
        entity_id:
          - media_player.living_room_fire_tv_living_room
          - media_player.travis_office_office_fire_tv
  mode: single
  icon: mdi:movie-open

focus_mode:
  alias: Focus mode
  sequence:
    - action: light.turn_on
      target:
        area_id: travis_office
      data:
        brightness_pct: 100
        transition: 2
  mode: single
  icon: mdi:desk-lamp-on

relax_mode:
  alias: Relax mode
  sequence:
    - action: light.turn_on
      target:
        area_id: travis_office
      data:
        brightness_pct: 30
        transition: 3
  mode: single
  icon: mdi:sofa

travis_office_lights_on:
  alias: Travis Office lights on
  sequence:
    - action: light.turn_on
      target:
        area_id: travis_office
      data:
        brightness_pct: 100
        transition: 2
  mode: single
  icon: mdi:lightbulb-on

travis_office_lights_off:
  alias: Travis Office lights off
  sequence:
    - action: light.turn_off
      target:
        area_id: travis_office
      data:
        transition: 2
  mode: single
  icon: mdi:lightbulb-off

pause_all_media:
  alias: Pause all media
  sequence:
    - action: media_player.media_pause
      target:
        entity_id: all
  mode: single
  icon: mdi:pause

living_room_lights_on:
  alias: Living room lights on
  sequence:
    - action: light.turn_on
      target:
        entity_id: light.living_room_ceiling_fan
      data:
        brightness_pct: 100
  mode: single
  icon: mdi:lightbulb-on

living_room_lights_off:
  alias: Living room lights off
  sequence:
    - action: light.turn_off
      target:
        entity_id: light.living_room_ceiling_fan
      data:
        transition: 2
  mode: single
  icon: mdi:lightbulb-off

living_room_relax_mode:
  alias: Living room relax mode
  sequence:
    - action: light.turn_on
      target:
        entity_id: light.living_room_ceiling_fan
      data:
        brightness_pct: 30
        transition: 3
  mode: single
  icon: mdi:sofa

living_room_movie_mode:
  alias: Living room movie mode
  sequence:
    - action: light.turn_on
      target:
        entity_id: light.living_room_ceiling_fan
      data:
        brightness_pct: 10
        transition: 3
    - action: media_player.media_pause
      target:
        entity_id: media_player.living_room_fire_tv_living_room
      continue_on_error: true
  mode: single
  icon: mdi:movie-open

goodnight_door_check:
  alias: Goodnight door/window check
  sequence:
    - variables:
        any_open: >-
          {{ is_state('binary_sensor.living_room_front_door', 'on')
             or is_state('binary_sensor.backdoor', 'on') }}
        open_names: >
          {% set open = [] %}
          {% if is_state('binary_sensor.living_room_front_door', 'on') %}
            {% set open = open + ['Front door'] %}
          {% endif %}
          {% if is_state('binary_sensor.backdoor', 'on') %}
            {% set open = open + ['Back door'] %}
          {% endif %}
          {{ open | join(', ') }}
    - if:
        - condition: template
          value_template: "{{ any_open }}"
      then:
        - action: persistent_notification.create
          data:
            title: Goodnight warning
            message: "Left open: {{ open_names }}"
            notification_id: goodnight_door_check
          continue_on_error: true
        - action: media_player.volume_set
          target:
            entity_id: media_player.master_bedroom_echo_dot
          data:
            volume_level: 0.7
          continue_on_error: true
        - action: notify.alexa_media_master_bedroom_echo_dot
          data:
            message: "Goodnight warning: {{ open_names }} left open."
            data:
              type: announce
          continue_on_error: true
  mode: single
  icon: mdi:door-open

goodnight_dim_lights:
  alias: Goodnight dim lights
  sequence:
    - variables:
        lights_on: "{{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
    - condition: template
      value_template: "{{ lights_on | length > 0 }}"
    - action: light.turn_on
      data:
        entity_id: "{{ lights_on }}"
        brightness_pct: 1
        transition: 10
    - delay: "00:00:11"
    - action: light.turn_off
      data:
        entity_id: "{{ lights_on }}"
        transition: 2
  mode: single
  icon: mdi:brightness-6

goodnight_enable_security:
  alias: Goodnight enable security
  sequence:
    - action: switch.turn_on
      target:
        entity_id:
          - switch.front_door_motion_detection
          - switch.downstairs_motion_detection
      continue_on_error: true
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.night_mode
  mode: single
  icon: mdi:shield-home
