homeassistant:

# Loads default set of integrations. Do not remove.
default_config:

# Home Assistant Cloud - Alexa entity exposure filter
cloud:
  alexa:
    filter:
      include_domains:
        - alarm_control_panel
        - binary_sensor
        - button
        - camera
        - climate
        - cover
        - fan
        - group
        - input_boolean
        - light
        - lock
        - media_player
        - script
        - sensor
        - switch
        - vacuum
      exclude_domains:
        - automation
        - update
        - weather
      exclude_entity_globs:
        - sensor.*_battery
        - sensor.*_cpu_percent
        - sensor.*_memory_percent
        - sensor.ha_disk_usage
        - sensor.ha_last_backup_age
        - sensor.home_assistant_*
        - sensor.exos_router_*
        - sensor.p1s_*_temperature
        - sensor.p1s_*_fan_speed
        - sensor.p1s_*_speed
        - binary_sensor.p1s_*_firmware
        - binary_sensor.p1s_*_developer_lan_mode
        - binary_sensor.p1s_*_mqtt_encryption
        - binary_sensor.p1s_*_hybrid_mqtt_control_blocked
        - sensor.sun_*
        - sensor.backup_*

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: storage
  dashboards:
    budget-dashboard:
      mode: yaml
      title: Budget
      icon: mdi:currency-usd
      show_in_sidebar: true
      filename: budget-dashboard.yaml

# Limit DB growth and SD-card wear
recorder:
  purge_keep_days: 30
  exclude:
    domains:
      - sun
      - weather
    entity_globs:
      - sensor.home_assistant_core_*
      - sensor.home_assistant_host_*
      - sensor.home_assistant_supervisor_*
      - sensor.*_cpu_percent
      - sensor.*_memory_percent
      - sensor.*_wifi_signal
      - binary_sensor.p1s_*_firmware
      - binary_sensor.p1s_*_developer_lan_mode
      - binary_sensor.p1s_*_mqtt_encryption
      - binary_sensor.p1s_*_hybrid_mqtt_control_blocked
      - sensor.exos_router_data_*
      - sensor.exos_router_packet_*
      - sensor.exos_router_port_*
      - sensor.p1s_*_nozzle_temperature
      - sensor.p1s_*_bed_temperature
      - sensor.p1s_*_fan_*
      - sensor.p1s_*_speed
      - image.p1s_*_*
      - camera.p1s_*_camera

# SD-card disk usage sensor for the PI section
command_line:
  - sensor:
      name: "HA disk usage"
      unique_id: ha_disk_usage
      command: "df -h /config | awk 'NR==2 {print $5}' | sed 's/%//'"
      unit_of_measurement: "%"
      value_template: "{{ value | int(0) }}"
      scan_interval: 300
  # Age of the newest Supervisor backup in days — backs the stale-backup
  # alert, which catches the case where the weekly backup never ran at all
  # (the backup script itself can only report failures while it runs).
  - sensor:
      name: "HA last backup age"
      unique_id: ha_last_backup_age
      command: "python3 /config/scripts/last_backup_age.py"
      unit_of_measurement: "days"
      value_template: "{{ value | float(9999) }}"
      scan_interval: 3600
  # Sum of Billy bills + recurring charges due in the next 30 days — backs the
  # bills-coverage binary sensor and the AI dashboard shortfall banner. The
  # per-item breakdown rides along as the `items` attribute for the payday
  # templates below.
  - sensor:
      name: "Bills due next 30 days"
      unique_id: bills_due_next_30_days
      command: "python3 /config/scripts/billy_due_next_30_days.py"
      unit_of_measurement: "$"
      value_template: "{{ value_json.total_30d }}"
      json_attributes:
        - items
      scan_interval: 3600

# True live view for the backyard Ring cam: ring-mqtt (add-on) bridges the
# Ring cloud WebRTC session to RTSP; this camera transcodes it to MJPEG for
# the AI dashboard's /ai-dashboard/cam_stream proxy. The RTSP stream only
# exists while switch.downstairs_live_stream is on (Ring is on-demand only).
ffmpeg:

camera:
  - platform: ffmpeg
    name: Backyard RTSP Live
    input: -rtsp_transport tcp -i rtsp://03cabcc9-ring-mqtt:8554/343ea446d53f_live
    extra_arguments: -pred 1 -vf fps=2 -q:v 6
  # Front door Ring cam RTSP (ring-mqtt) — used only for recording 10s motion/
  # ding clips to the AI dashboard history archive via camera.record; the
  # dashboard itself shows last-activity stills (battery cam, no live view).
  # The RTSP path exists only while switch.front_door_live_stream is on.
  # ffmpeg platform (not generic): generic validates the source at setup and
  # never creates the entity while the stream is off; ffmpeg connects lazily.
  - platform: ffmpeg
    name: Front Door RTSP Live
    input: -rtsp_transport tcp -i rtsp://03cabcc9-ring-mqtt:8554/343ea435ca6d_live

# Reduce noisy integration logs while keeping errors visible
logger:
  default: info
  logs:
    custom_components.bambu_lab.pybambu: critical
    pylitterbot.transport: warning
    homeassistant.components.bluetooth: warning

input_boolean:
  night_mode:
    name: Night mode
    icon: mdi:weather-night
    initial: false

input_number:
  master_bedroom_echo_dot_volume:
    name: Master bedroom Echo Dot previous volume
    min: 0
    max: 1
    step: 0.01
    initial: 0.4

# Anchor date for the biweekly payday cycle — the next (or any recent) payday.
# Paydays recur every 14 days from this date; the template sensors below
# project it forward. Update here if the schedule ever shifts.
input_datetime:
  payday_anchor:
    name: Payday anchor
    has_date: true
    has_time: false
    initial: 2026-10-16

# Remove backups older than 14 days via the Supervisor API.
# The backup.remove service used by the previous automation does not exist.
shell_command:
  cleanup_old_backups: "python3 /config/scripts/cleanup_old_backups.py"
  create_weekly_backup: "python3 /config/scripts/create_weekly_backup.py"

automation: !include automations.yaml
script: !include scripts.yaml

# AI dashboard proxy (serves /ai-dashboard/ and handles auth server-side)
ai_dashboard_proxy:

# openhasp: !include_dir_merge_named openhasp/  # retired — panel now runs ESPHome + LVGL

light:
  - platform: group
    name: Living room ceiling fan
    unique_id: living_room_ceiling_fan
    entities:
      - light.third_reality_inc_3rcb01057z_4
      - light.third_reality_inc_3rcb01057z_5
      - light.third_reality_inc_3rcb01057z_6

# Filter nws_alerts down to warnings and watches only for the AI dashboard banner
template:
  - trigger:
      - platform: time_pattern
        minutes: /15
      - platform: homeassistant
        event: start
    action:
      - service: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.forecast_home
        response_variable: forecast_response
    sensor:
      # Today's forecast high/low for the CrowPanel weather card. The weather
      # entity no longer exposes forecast as a state attribute in HA 2024.4+,
      # so we call weather.get_forecasts and expose the first daily entry.
      - name: "Weather forecast high today"
        unique_id: weather_forecast_high_today
        unit_of_measurement: "°F"
        state: "{{ forecast_response['weather.forecast_home'].forecast[0].temperature }}"
        availability: "{{ forecast_response['weather.forecast_home'].forecast | length > 0 }}"

      - name: "Weather forecast low today"
        unique_id: weather_forecast_low_today
        unit_of_measurement: "°F"
        state: "{{ forecast_response['weather.forecast_home'].forecast[0].templow }}"
        availability: "{{ forecast_response['weather.forecast_home'].forecast | length > 0 }}"

  - sensor:
      - name: "NWS warnings watches"
        unique_id: nws_warnings_watches
        state: >
          {{ state_attr('sensor.nws_alerts_gps_40_8141_96_7503_nws_alerts_alerts', 'Alerts')
             | default([])
             | selectattr('Event', 'search', '(Warning|Watch)$')
             | list | length }}
        availability: >
          {{ state_attr('sensor.nws_alerts_gps_40_8141_96_7503_nws_alerts_alerts', 'Alerts') is not none }}

      - name: "NWS warning watch events"
        unique_id: nws_warning_watch_events
        state: >
          {% set alerts = state_attr('sensor.nws_alerts_gps_40_8141_96_7503_nws_alerts_alerts', 'Alerts') | default([]) %}
          {% set events = alerts | selectattr('Event', 'search', '(Warning|Watch)$') | map(attribute='Event') | list %}
          {{ events | join(', ') if events | length > 0 else 'None' }}
        availability: >
          {{ state_attr('sensor.nws_alerts_gps_40_8141_96_7503_nws_alerts_alerts', 'Alerts') is not none }}

  # CrowPanel charging heuristic: when the battery is held above 4.15 V it is
  # either in the constant-voltage topping phase or fully charged on USB power.
  # This is not perfect (does not detect the early CC phase at lower voltages),
  # but it works without hardware modifications. If you want true CHG-pin
  # detection later, solder the TP4059 CHG pin to a free ESP32 GPIO.
  - binary_sensor:
      - name: "Panel charging"
        unique_id: panel_charging
        state: >
          {% set v = states('sensor.panel_battery_voltage') | float(none) %}
          {{ v is not none and v > 4.15 }}

  # Bill coverage: does the checking account cover everything due in the next
  # 30 days? Stale SimpleFIN data counts as NOT covered — a dead bank sync must
  # never silently suppress the warning.
  - sensor:
      - name: "Bills coverage amount"
        unique_id: bills_coverage_amount
        unit_of_measurement: "$"
        state: >
          {{ (states('sensor.west_gate_bank_checking_2075_balance') | float(0)
              - states('sensor.bills_due_next_30_days') | float(0)) | round(2) }}
        availability: >
          {{ states('sensor.west_gate_bank_checking_2075_balance') | float(none) is not none
             and states('sensor.bills_due_next_30_days') | float(none) is not none }}

  - binary_sensor:
      - name: "Bills covered"
        unique_id: bills_covered
        state: >
          {% set coverage = states('sensor.bills_coverage_amount') | float(none) %}
          {% set age_ts = as_timestamp(states('sensor.west_gate_bank_checking_2075_data_age'), none) %}
          {% set fresh = age_ts is not none and now().timestamp() - age_ts < 172800 %}
          {% set problem = states('binary_sensor.west_gate_bank_checking_2075_possible_error') %}
          {{ coverage is not none and coverage >= 0 and fresh and problem == 'off' }}

  # Payday cycle: biweekly, anchored at input_datetime.payday_anchor (any one
  # payday — the template projects forward in 14-day steps).
  - sensor:
      - name: "Next payday"
        unique_id: next_payday
        device_class: date
        state: >
          {% set a = strptime(states('input_datetime.payday_anchor'), '%Y-%m-%d').date() %}
          {% set diff = (a - now().date()).days %}
          {% if diff >= 0 %}
            {{ a.isoformat() }}
          {% else %}
            {% set k = ((-diff) / 14) | round(0, 'ceil') | int %}
            {{ (a + timedelta(days=14 * k)).isoformat() }}
          {% endif %}
        availability: >
          {{ states('input_datetime.payday_anchor') not in ('unknown', 'unavailable', '') }}

      - name: "Days until payday"
        unique_id: days_until_payday
        unit_of_measurement: "days"
        state: >
          {{ (strptime(states('sensor.next_payday'), '%Y-%m-%d').date() - now().date()).days }}
        availability: >
          {{ states('sensor.next_payday') not in ('unknown', 'unavailable', '') }}

      # Sum of unpaid bills + recurring charges due on/before the next payday
      # (the per-item list comes from the bills_due_next_30_days sensor's
      # `items` attribute; ISO date strings compare lexicographically).
      - name: "Bills due before payday"
        unique_id: bills_due_before_payday
        unit_of_measurement: "$"
        state: >
          {% set payday = states('sensor.next_payday') %}
          {% set items = state_attr('sensor.bills_due_next_30_days', 'items') %}
          {{ items | selectattr('due_date', 'le', payday) | map(attribute='amount') | sum | round(2) }}
        availability: >
          {{ states('sensor.next_payday') not in ('unknown', 'unavailable', '')
             and state_attr('sensor.bills_due_next_30_days', 'items') is not none }}

      - name: "Safe to spend until payday"
        unique_id: safe_to_spend_until_payday
        unit_of_measurement: "$"
        state: >
          {{ (states('sensor.west_gate_bank_checking_2075_balance') | float(0)
              - states('sensor.bills_due_before_payday') | float(0)) | round(2) }}
        availability: >
          {{ states('sensor.west_gate_bank_checking_2075_balance') | float(none) is not none
             and states('sensor.bills_due_before_payday') | float(none) is not none }}
