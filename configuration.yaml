homeassistant:
  allowlist_external_dirs:
    - "/config/openhasp"

# Loads default set of integrations. Do not remove.
default_config:

# Home Assistant Cloud - Alexa entity exposure filter
cloud:
  alexa:
    filter:
      include_domains:
        - alarm_control_panel
        - binary_sensor
        - button
        - camera
        - climate
        - cover
        - fan
        - group
        - input_boolean
        - light
        - lock
        - media_player
        - scene
        - script
        - sensor
        - switch
        - vacuum
      exclude_domains:
        - automation
        - update
        - weather
      exclude_entity_globs:
        - sensor.*_battery
        - sensor.*_cpu_percent
        - sensor.*_memory_percent
        - sensor.ha_disk_usage
        - sensor.home_assistant_*
        - sensor.exos_router_*
        - sensor.p1s_*_temperature
        - sensor.p1s_*_fan_speed
        - sensor.p1s_*_speed
        - binary_sensor.p1s_*_firmware
        - binary_sensor.p1s_*_developer_lan_mode
        - binary_sensor.p1s_*_mqtt_encryption
        - binary_sensor.p1s_*_hybrid_mqtt_control_blocked
        - sensor.sun_*
        - sensor.backup_*

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Limit DB growth and SD-card wear
recorder:
  purge_keep_days: 30
  exclude:
    domains:
      - updater
      - sun
      - weather
    entity_globs:
      - sensor.home_assistant_core_*
      - sensor.home_assistant_host_*
      - sensor.home_assistant_supervisor_*
      - sensor.*_cpu_percent
      - sensor.*_memory_percent
      - sensor.*_wifi_signal
      - binary_sensor.p1s_*_firmware
      - binary_sensor.p1s_*_developer_lan_mode
      - binary_sensor.p1s_*_mqtt_encryption
      - binary_sensor.p1s_*_hybrid_mqtt_control_blocked
      - sensor.exos_router_data_*
      - sensor.exos_router_packet_*
      - sensor.exos_router_port_*
      - sensor.p1s_*_nozzle_temperature
      - sensor.p1s_*_bed_temperature
      - sensor.p1s_*_fan_*
      - sensor.p1s_*_speed
      - image.p1s_*_*
      - camera.p1s_*_camera

# SD-card disk usage sensor for the PI section
command_line:
  - sensor:
      name: "HA disk usage"
      unique_id: ha_disk_usage
      command: "df -h /config | awk 'NR==2 {print $5}' | sed 's/%//'"
      unit_of_measurement: "%"
      value_template: "{{ value | int(0) }}"
      scan_interval: 300

# Reduce noisy integration logs while keeping errors visible
logger:
  default: info
  logs:
    custom_components.bambu_lab.pybambu: critical
    pylitterbot.transport: warning
    homeassistant.components.bluetooth: warning

input_boolean:
  voice_mute:
    name: Voice mute
    icon: mdi:microphone-off
    initial: false

# Remove backups older than 14 days via the Supervisor API.
# The backup.remove service used by the previous automation does not exist.
shell_command:
  cleanup_old_backups: "python3 /config/scripts/cleanup_old_backups.py"
  create_weekly_backup: "python3 /config/scripts/create_weekly_backup.py"

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# AI dashboard proxy (serves /ai-dashboard/ and handles auth server-side)
ai_dashboard_proxy:

openhasp: !include_dir_merge_named openhasp/

light:
  - platform: group
    name: Living room ceiling fan
    unique_id: living_room_ceiling_fan
    entities:
      - light.third_reality_inc_3rcb01057z_4
      - light.third_reality_inc_3rcb01057z_5
      - light.third_reality_inc_3rcb01057z_6

lovelace:
  dashboards:
    ipad-wall-panel:
      mode: yaml
      title: iPad Wall Panel
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      require_admin: false
      filename: ipad-wall-panel.yaml
