<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Assistant Wall Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" />
<style>
:root {
  --bg: #030503;
  --bg-glow: #0a140a;
  --green: #14fe17;
  --green-dim: #1a4a1a;
  --green-hover: #2d7a2d;
  --text: #e8ffe8;
  --text-muted: #5a7a5a;
  --amber: #ffae00;
  --danger: #ff3333;
  --font-mono: 'Share Tech Mono', monospace;
  --panel-bg: rgba(8, 18, 8, 0.92);
  --border: rgba(20, 254, 23, 0.45);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body { position: relative; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.panel-title, #clock, #date, .bottom-btn, .scene-btn, .radar-timestamp, .metric-label, .status-led {
  font-family: var(--font-mono);
}
@keyframes crtFlicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.985; }
}
#app {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  padding: 18px;
  gap: 16px;
  animation: crtFlicker 0.12s infinite;
}
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 1000;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,30,0,0.12) 2px,
    rgba(0,30,0,0.12) 4px
  );
}
.vignette {
  position: fixed; inset: 0; z-index: 999; pointer-events: none;
  background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.55) 100%);
}
.terminal-panel {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  position: relative;
  box-shadow: 0 0 18px rgba(20, 254, 23, 0.08);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.terminal-panel:hover {
  border-color: rgba(20, 254, 23, 0.7);
  box-shadow: 0 0 24px rgba(20, 254, 23, 0.18);
}
.terminal-panel::before,
.terminal-panel::after {
  position: absolute;
  top: -1px;
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 0.9rem;
  text-shadow: 0 0 6px var(--green);
}
.terminal-panel::before { content: "┌"; left: 6px; }
.terminal-panel::after { content: "┐"; right: 6px; }
.panel-title {
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--green); padding: 10px 14px 6px;
  text-shadow: 0 0 8px rgba(20, 254, 23, 0.45);
}
.panel-body { padding: 10px 14px 14px; }
@keyframes ledPulse {
  0%, 100% { box-shadow: 0 0 8px var(--green); }
  50% { box-shadow: 0 0 16px var(--green); }
}
.status-led {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  background: var(--text-muted);
  box-shadow: 0 0 4px var(--text-muted);
}
.status-led.on {
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: ledPulse 2s infinite ease-in-out;
}
.status-led.warn {
  background: var(--amber);
  box-shadow: 0 0 10px var(--amber);
}
.status-led.danger { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
.bottom-btn {
  flex: 1;
  height: 100%;
  background: rgba(10, 20, 10, 0.85);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 1rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(20, 254, 23, 0.05);
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s;
}
.bottom-btn:hover {
  background: rgba(20, 254, 23, 0.1);
  border-color: rgba(20, 254, 23, 0.8);
  box-shadow: 0 0 18px rgba(20, 254, 23, 0.25);
  text-shadow: 0 0 8px var(--green);
}
.bottom-btn:active {
  background: rgba(20, 254, 23, 0.05);
  box-shadow: inset 0 0 12px rgba(20, 254, 23, 0.25);
}
.scene-btn {
  background: rgba(10, 20, 10, 0.85);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--green);
  font-family: var(--font-mono);
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.scene-btn:hover {
  background: rgba(20, 254, 23, 0.12);
  border-color: rgba(20, 254, 23, 0.8);
  box-shadow: 0 0 14px rgba(20, 254, 23, 0.2);
}
.scene-btn:active {
  box-shadow: inset 0 0 10px rgba(20, 254, 23, 0.25);
}
.screen { display: none; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.screen.active { display: flex; }
.settings-close {
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  color: var(--text); border-radius: 4px; padding: 6px 12px; cursor: pointer;
  font-family: var(--font-mono);
}
.btn {
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  color: var(--text); border-radius: 4px; padding: 8px 14px; cursor: pointer;
  font-family: var(--font-mono);
}
.btn:hover { background: rgba(255,255,255,0.14); }
.btn-primary { background: rgba(20, 254, 23, 0.14); border-color: rgba(20, 254, 23, 0.45); color: var(--green); }
.entity-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 10px; font-size: 0.8rem; margin: 4px 4px 0 0;
}
.entity-chip button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; }
input, select {
  background: rgba(255,255,255,0.07); border: 1px solid var(--border); border-radius: 4px;
  padding: 8px 10px; color: var(--text); font-size: 0.9rem;
}
input[type="range"] { accent-color: var(--green); }
.leaflet-container { background: #000; }
#radar-map { width: 100%; height: 100%; position: relative; }
@keyframes clockPulse {
  0%, 100% { text-shadow: 0 0 24px rgba(20,254,23,0.45); opacity: 1; }
  50% { text-shadow: 0 0 48px rgba(20,254,23,0.85); opacity: 0.82; }
}
#clock { animation: clockPulse 2.2s infinite ease-in-out; }
.radar-timestamp {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 500;
  background: rgba(0,0,0,0.6);
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="status-led" class="status-led" style="position:fixed;top:14px;left:14px;z-index:50;"></div>
<div id="status-text" style="position:fixed;top:12px;left:32px;z-index:50;font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);">CONNECTING</div>
<button id="settings-btn" style="position:fixed;top:10px;right:14px;z-index:50;background:transparent;border:none;color:var(--text-muted);font-family:var(--font-mono);cursor:pointer;" onclick="openSettings()">[ SETTINGS ]</button>

<div id="app">
  <div id="home-screen" class="screen active"></div>
  <div id="control-screen" class="screen">CONTROL HUB</div>
  <div id="security-screen" class="screen">SECURITY</div>
  <div id="status-screen" class="screen">STATUS MONITOR</div>
  <div id="dock" style="display:flex;gap:14px;height:70px;flex-shrink:0;"></div>
</div>

<div id="settings-overlay" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;">
  <div id="settings-panel" class="terminal-panel" style="width:min(760px,92vw);max-height:88vh;overflow-y:auto;">
    <div class="settings-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <h2 class="settings-title" style="font-size:1.2rem;font-weight:700;margin:0;font-family:var(--font-mono);">Dashboard Settings</h2>
      <button class="settings-close" onclick="closeSettings()">Close</button>
    </div>
    <div id="settings-body"></div>
    <div class="settings-row" style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px;">
      <button class="btn" onclick="exportConfig()">Export JSON</button>
      <button class="btn" onclick="importConfig()">Import JSON</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save & Apply</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_CONFIG = {
  theme: { backgroundImage: "", accentColor: "#2dd4bf" },
  layout: { left: ["home", "environment", "presence"], center: ["clock", "radar", "forecast"], right: ["scenes", "quickControls", "security", "system", "cameras"], clock24h: false },
  entities: {
    weather: "weather.forecast_home",
    temperatures: ["sensor.hobeian_zg_204zx_temperature", "sensor.hobeian_zg_204zx_temperature_2"],
    summaryChips: [],
    mediaPlayer: "media_player.living_room_fire_tv_living_room",
    quickControls: ["scene.all_lights_off", "scene.living_room_lights_on", "script.goodnight", "light.living_room_ceiling_fan"]
  },
  sections: {
    home: { title: "Home", icon: "🏠", entities: ["person.woteg", "device_tracker.traviss_iphone", "weather.forecast_home"] },
    scenes: { title: "Scenes", icon: "🎨", entities: ["scene.all_lights_off", "scene.living_room_lights_on", "scene.relax_mode", "scene.movie_mode", "script.goodnight", "script.focus_mode"] },
    quickControls: { title: "Quick Controls", icon: "🎛️", entities: ["light.ceiling_fan", "light.living_room_ceiling_fan", "media_player.living_room_fire_tv_living_room"] },
    cameras: { title: "Cameras", icon: "📷", entities: ["camera.front_door_live_view", "camera.downstairs_live_view"] },
    security: { title: "Security", icon: "🛡️", entities: ["switch.front_door_motion_detection", "switch.downstairs_motion_detection", "sensor.front_door_battery", "sensor.downstairs_battery", "siren.downstairs_siren", "siren.downstairs_siren_2"] },
    environment: { title: "Environment", icon: "🌡️", entities: ["sensor.hobeian_zg_204zx_temperature", "sensor.hobeian_zg_204zx_humidity", "sensor.hobeian_zg_204zx_illuminance", "sensor.hobeian_zg_204zx_temperature_2", "sensor.hobeian_zg_204zx_humidity_2", "sensor.hobeian_zg_204zx_illuminance_2"] },
    presence: { title: "Presence", icon: "👤", entities: ["binary_sensor.hobeian_zg_204zx", "binary_sensor.hobeian_zg_204zx_2"] },
    system: { title: "System", icon: "⚙️", entities: ["sensor.home_assistant_core_cpu_percent", "sensor.home_assistant_core_memory_percent", "sensor.ha_disk_usage", "vacuum.geordi_la_forge", "vacuum.pooper_litter_box", "update.home_assistant_core_update", "update.home_assistant_operating_system_update", "update.home_assistant_supervisor_update"] }
  },
  dock: { items: [{ icon: "💡", entityId: "scene.all_lights_off", label: "All off" }, { icon: "🌙", entityId: "script.goodnight", label: "Goodnight" }, { icon: "⚙️", action: "settings", label: "Settings" }] }
};

const DOMAIN_ICONS = {
  light: { on: "💡", off: "🌑" }, switch: { on: "⚡", off: "🔌" }, fan: { on: "🌀", off: "🍃" },
  binary_sensor: { on: "🔔", off: "🔕" }, climate: "🌡️", media_player: "📺", vacuum: "🤖",
  sensor: "📊", weather: "🌤️", scene: "🎬", script: "▶️", button: "🔘", number: "🔢",
  select: "☰", cover: "🪟", lock: "🔒", input_boolean: { on: "✅", off: "⬜" },
  person: "👤", device_tracker: "📍", camera: "📷", siren: "🚨", update: "🔄", alarm_control_panel: "🛡️"
};

let config = {};
let token = "";
let ws = null;
let reconnectDelay = 1000;
let states = {};
let areas = [];
let entities = [];
let areaMap = {};
let entityById = {};
let haConfig = null;
let forecastCache = { daily: [], fetchedAt: null };
let currentScreen = "home";

async function refreshForecast() {
  const weatherId = config.entities.weather || "weather.forecast_home";
  const state = states[weatherId];
  // Fallback 1: entity attribute
  if (state && state.attributes && Array.isArray(state.attributes.forecast)) {
    forecastCache.daily = state.attributes.forecast.slice(0, 5);
    forecastCache.fetchedAt = Date.now();
    return;
  }
  // Primary: HA service call
  const res = await apiCall("POST", "/api/services/weather/get_forecasts", {
    entity_id: weatherId,
    type: "daily"
  });
  if (res && Array.isArray(res)) {
    const entry = res.find(r => r.entity_id === weatherId);
    if (entry && entry.forecast && Array.isArray(entry.forecast.forecast)) {
      forecastCache.daily = entry.forecast.forecast.slice(0, 5);
      forecastCache.fetchedAt = Date.now();
      return;
    }
  }
  forecastCache.daily = [];
}

function deepMerge(target, ...sources) {
  for (const src of sources) {
    if (!src) continue;
    for (const key of Object.keys(src)) {
      if (src[key] && typeof src[key] === "object" && !Array.isArray(src[key])) {
        target[key] = target[key] || {};
        deepMerge(target[key], src[key]);
      } else {
        target[key] = src[key];
      }
    }
  }
  return target;
}

async function loadConfig() {
  let fileConfig = {};
  try {
    const r = await fetch("config.json", { cache: "no-store" });
    if (r.ok) fileConfig = await r.json();
  } catch (e) {}
  let lsConfig = {};
  try {
    const raw = localStorage.getItem("ha_dashboard_config");
    if (raw) lsConfig = JSON.parse(raw);
  } catch (e) {}
  return deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), fileConfig, lsConfig);
}

function saveConfig() {
  localStorage.setItem("ha_dashboard_config", JSON.stringify(config));
}

function applyTheme() {
  const accent = config.theme.accentColor || DEFAULT_CONFIG.theme.accentColor;
  document.documentElement.style.setProperty("--accent", accent);
}

function friendlyName(entityId) {
  const s = states[entityId];
  if (s && s.attributes && s.attributes.friendly_name) return s.attributes.friendly_name;
  const e = entityById[entityId];
  if (e) return e.name || e.original_name || entityId;
  return entityId.split(".").pop().replace(/_/g, " ");
}

function entityArea(entityId) {
  return (window.HA_AREAS && window.HA_AREAS[entityId]) || "";
}

function iconFor(entityId, state) {
  const domain = entityId.split(".")[0];
  const s = (state || "").toLowerCase();
  const map = DOMAIN_ICONS[domain];
  if (typeof map === "object") {
    if (["on","playing","open","home","heat","cool","auto","active","true"].includes(s)) return map.on || map.off;
    return map.off || map.on;
  }
  return map || "●";
}

function isActive(state) {
  return ["on","playing","open","home","heat","cool","auto","active","true","cleaning","docked","idle"].includes((state || "").toLowerCase());
}

function isActionable(domain) {
  return ["light","switch","fan","scene","script","button","input_boolean","cover","lock","media_player","siren"].includes(domain);
}

function formatState(state) {
  if (!state) return "unknown";
  const unit = state.attributes && state.attributes.unit_of_measurement ? state.attributes.unit_of_measurement : "";
  return `${state.state} ${unit}`.trim();
}

function weatherIcon(condition) {
  const c = (condition || "").toLowerCase();
  if (c.includes("clear") || c.includes("sunny")) return "☀️";
  if (c.includes("partly")) return "⛅";
  if (c.includes("cloud")) return "☁️";
  if (c.includes("rain") || c.includes("drizzle")) return "🌧️";
  if (c.includes("snow")) return "❄️";
  if (c.includes("storm") || c.includes("thunder")) return "⛈️";
  if (c.includes("fog") || c.includes("mist")) return "🌫️";
  return "🌤️";
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function setStatus(cls) {
  const led = document.getElementById("status-led");
  const text = document.getElementById("status-text");
  if (text) text.textContent = cls.toUpperCase();
  if (led) {
    led.className = "status-led";
    if (cls === "connected") led.classList.add("on");
    else if (cls === "disconnected") led.classList.add("danger");
    else led.classList.add("warn");
  }
  if (cls === "connected") reconnectDelay = 1000;
}

function toggleEntity(entityId) {
  if (!ws) return;
  const domain = entityId.split(".")[0];
  let service = "toggle";
  if (["scene","script","button"].includes(domain)) service = "turn_on";
  else if (domain === "media_player") service = "media_play_pause";
  else if (domain === "lock") {
    const st = states[entityId] && states[entityId].state;
    service = st === "locked" ? "unlock" : "lock";
  }
  ws.send(JSON.stringify({ id: Date.now(), type: "call_service", domain, service, service_data: { entity_id: entityId } }));
}

function mediaCmd(eid, service) {
  if (!ws) return;
  ws.send(JSON.stringify({ id: Date.now(), type: "call_service", domain: "media_player", service, service_data: { entity_id: eid } }));
}

function setBrightness(entityId, pct) {
  if (!ws) return;
  const value = Math.round((parseInt(pct, 10) / 100) * 255);
  ws.send(JSON.stringify({ id: Date.now(), type: "call_service", domain: "light", service: "turn_on", service_data: { entity_id: entityId, brightness: value } }));
}

async function apiFetch(path) {
  const headers = token ? { "Authorization": `Bearer ${token}` } : {};
  try {
    const r = await fetch(path, { headers });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    console.error("apiFetch failed", path, e);
    return null;
  }
}

async function apiCall(method, path, body) {
  const headers = token ? { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
  try {
    const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    console.error("apiCall failed", method, path, e);
    return null;
  }
}

async function fetchRegistry() {
  const [aRes, eRes] = await Promise.all([
    apiFetch("/api/config/area_registry/list"),
    apiFetch("/api/config/entity_registry/list")
  ]);
  areas = aRes || [];
  entities = eRes || [];
  areaMap = {};
  for (const a of areas) areaMap[a.area_id] = a.name;
  entityById = {};
  for (const e of entities) entityById[e.entity_id] = e;
}

async function fetchHAConfig() {
  if (haConfig) return haConfig;
  if (window.HA_CONFIG) {
    haConfig = window.HA_CONFIG;
    return haConfig;
  }
  haConfig = await apiFetch("/api/config");
  return haConfig;
}

// ---- Component renderers ----

function renderTerminalPanel(title, bodyHtml) {
  return `<div class="terminal-panel">
    <div class="panel-title">${escapeHtml(title)}</div>
    <div class="panel-body">${bodyHtml}</div>
  </div>`;
}

function renderStatusLed(state) {
  let cls = "";
  const s = String(state || "").toLowerCase();
  if (["on","playing","open","home","heat","cool","auto","active","true","cleaning","docked","idle"].includes(s)) cls = "on";
  else if (["unavailable","unknown","offline"].includes(s)) cls = "danger";
  return `<span class="status-led ${cls}"></span>`;
}

function renderAlertTicker(alerts) {
  if (!alerts || !alerts.length) {
    return `<div class="terminal-panel"><div class="panel-body" style="color:var(--text-muted);font-family:var(--font-mono);">SYSTEM NORMAL</div></div>`;
  }
  const items = alerts.slice(0,3).map(a => `<div style="color:var(--amber);font-family:var(--font-mono);margin:4px 0;">! ${escapeHtml(a)}</div>`).join("");
  return `<div class="terminal-panel"><div class="panel-body">${items}</div></div>`;
}

function renderSceneButton(entityId) {
  const name = friendlyName(entityId);
  return `<button class="scene-btn" onclick="toggleEntity('${entityId}')">${escapeHtml(name)}</button>`;
}

function renderLightCard(entityId) {
  const state = states[entityId];
  const active = state ? isActive(state.state) : false;
  const brightness = state && state.attributes && state.attributes.brightness != null ? state.attributes.brightness : 0;
  const pct = Math.round((brightness / 255) * 100);
  return `<div class="terminal-panel" style="margin-bottom:10px;" data-entity-id="${entityId}">
    <div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;" onclick="toggleEntity('${entityId}')">
      <div>${renderStatusLed(active ? "on" : "off")} <span style="font-family:var(--font-mono);">${escapeHtml(friendlyName(entityId))}</span></div>
      <div style="color:var(--text-muted);font-family:var(--font-mono);">${active ? "ON" : "OFF"}</div>
    </div>
    ${active ? `<div class="panel-body" style="padding-top:0;"><input type="range" min="0" max="100" value="${pct}" style="width:100%;" onchange="setBrightness('${entityId}', this.value)" onclick="event.stopPropagation();"></div>` : ""}
  </div>`;
}

function renderMetricCard(entityId) {
  const state = states[entityId];
  if (!state) return "";
  const unit = state.attributes && state.attributes.unit_of_measurement ? state.attributes.unit_of_measurement : "";
  return `<div class="terminal-panel" style="text-align:center;padding:8px;" data-entity-id="${entityId}">
    <div style="font-family:var(--font-mono);font-size:1.4rem;color:var(--green);">${escapeHtml(state.state)}<span style="font-size:0.8rem;color:var(--text-muted);">${escapeHtml(unit)}</span></div>
    <div style="font-size:0.75rem;color:var(--text-muted);">${escapeHtml(friendlyName(entityId))}</div>
  </div>`;
}

function renderEnvMetric(entityId) {
  const state = states[entityId];
  if (!state) return "";
  const unit = state.attributes && state.attributes.unit_of_measurement ? state.attributes.unit_of_measurement : "";
  const deviceClass = state.attributes && state.attributes.device_class;
  const labelMap = { temperature: "TEMP", humidity: "HUM", illuminance: "LIGHT" };
  const label = labelMap[deviceClass] || (deviceClass ? deviceClass.toUpperCase() : entityId.split("_").pop().toUpperCase());
  return `<div class="terminal-panel" style="text-align:center;padding:10px 4px;" data-entity-id="${entityId}">
    <div style="font-family:var(--font-mono);font-size:1.5rem;color:var(--green);">${escapeHtml(state.state)}<span style="font-size:0.75rem;color:var(--text-muted);">${escapeHtml(unit)}</span></div>
    <div class="metric-label" style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">${escapeHtml(label)}</div>
  </div>`;
}

function renderCameraFeed(entityId) {
  const name = friendlyName(entityId);
  const state = states[entityId];
  let src = "";
  if (state && state.attributes && state.attributes.entity_picture) {
    src = state.attributes.entity_picture;
  } else if (window.HA_INTEGRATION_PROXY) {
    src = `/api/camera_proxy_stream/${entityId}`;
  } else {
    src = `/api/camera_proxy_stream/${entityId}?token=${encodeURIComponent(token)}`;
  }
  return `<div class="terminal-panel" style="margin-bottom:10px;" data-entity-id="${entityId}">
    <div class="panel-title">${escapeHtml(name)}</div>
    <div class="panel-body" style="padding:0;">
      <img class="camera-feed" src="${src}" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000;" alt="${escapeHtml(name)}">
    </div>
  </div>`;
}

function renderRadarFrame() {
  if (!haConfig || haConfig.latitude == null) return `<div class="terminal-panel"><div class="panel-body" style="color:var(--text-muted);">RADAR UNAVAILABLE</div></div>`;
  return `<div class="terminal-panel" style="height:100%;display:flex;flex-direction:column;">
    <div class="panel-title">WEATHER RADAR</div>
    <div class="panel-body" style="flex:1;padding:0;min-height:0;">
      <div id="radar-map">INITIALIZING RADAR...</div>
    </div>
  </div>`;
}

let radarMap = null;
let radarAnimInterval = null;
async function initRadarMap() {
  const el = document.getElementById("radar-map");
  if (!el || !window.L || !haConfig) return;
  if (radarMap) { radarMap.remove(); radarMap = null; }
  if (radarAnimInterval) { clearInterval(radarAnimInterval); radarAnimInterval = null; }
  try {
    const res = await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" });
    const data = await res.json();
    const frames = data.radar && data.radar.past;
    if (!frames || !frames.length) throw new Error("no radar frames");
    const map = window.L.map(el, { zoomControl: false, attributionControl: false, maxZoom: 7 }).setView(
      [haConfig.latitude, haConfig.longitude], 7
    );
    window.L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      { subdomains: "abcd", maxZoom: 19 }
    ).addTo(map);

    // Use the last 8 frames (~80 min) to keep tile count reasonable.
    const useFrames = frames.slice(-8);
    const layers = useFrames.map(f =>
      window.L.tileLayer(`${data.host}${f.path}/256/{z}/{x}/{y}/7/1_1.png`, {
        opacity: 0, maxZoom: 7, minZoom: 3
      }).addTo(map)
    );

    const timestamp = document.createElement("div");
    timestamp.className = "radar-timestamp";
    el.appendChild(timestamp);

    let idx = layers.length - 1;
    layers[idx].setOpacity(0.65);
    timestamp.textContent = new Date(useFrames[idx].time * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    radarAnimInterval = setInterval(() => {
      layers[idx].setOpacity(0);
      idx = (idx + 1) % layers.length;
      layers[idx].setOpacity(0.65);
      timestamp.textContent = new Date(useFrames[idx].time * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }, 700);

    setTimeout(() => map.invalidateSize(), 150);
    radarMap = map;
  } catch (e) {
    console.error("radar init failed", e);
    el.innerHTML = '<div style="color:var(--text-muted);padding:14px;">RADAR OFFLINE</div>';
  }
}

function renderMediaCard(entityId) {
  const state = states[entityId];
  if (!state) return "";
  const title = state.attributes && (state.attributes.media_title || state.attributes.friendly_name) || friendlyName(entityId);
  const artist = state.attributes && state.attributes.media_artist ? state.attributes.media_artist : state.state;
  const playing = state.state === "playing";
  return `<div class="terminal-panel" data-entity-id="${entityId}">
    <div class="panel-title">${escapeHtml(friendlyName(entityId))}</div>
    <div class="panel-body" style="font-family:var(--font-mono);">
      <div style="color:var(--green);">${escapeHtml(title)}</div>
      <div style="color:var(--text-muted);font-size:0.85rem;">${escapeHtml(artist)}</div>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="btn" onclick="mediaCmd('${entityId}','media_previous_track')">⏮</button>
        <button class="btn" onclick="mediaCmd('${entityId}','${playing ? "media_pause" : "media_play"}')">${playing ? "⏸" : "▶"}</button>
        <button class="btn" onclick="mediaCmd('${entityId}','media_next_track')">⏭</button>
      </div>

}

function renderBottomButton(label, target) {
  return `<button class="bottom-btn" onclick="showScreen('${target}')">${escapeHtml(label)}</button>`;
}

// ---- Screens ----

function getPresenceEntities() {
  const homeSection = (config.sections && config.sections.home && config.sections.home.entities) || [];
  return homeSection.filter(id => {
    const domain = id.split(".")[0];
    return domain === "person" || domain === "device_tracker";
  });
}

function getAlerts() {
  const alerts = [];
  const sec = config.sections && config.sections.security ? config.sections.security.entities : [];
  for (const id of sec) {
    const state = states[id];
    if (!state) continue;
    const domain = id.split(".")[0];
    const deviceClass = state.attributes && state.attributes.device_class;
    if (domain === "binary_sensor" && deviceClass === "motion" && isActive(state.state)) {
      alerts.push(`${friendlyName(id)} detected`);
    }
    if (domain === "siren" && isActive(state.state)) {
      alerts.push(`${friendlyName(id)} active`);
    }
    if (domain === "sensor" && deviceClass === "battery") {
      const val = parseFloat(state.state);
      if (!isNaN(val) && val < 20) alerts.push(`${friendlyName(id)} low`);
    }
  }
  const sys = config.sections && config.sections.system ? config.sections.system.entities : [];
  for (const id of sys) {
    if (id.startsWith("update.") && states[id] && states[id].state === "on") {
      alerts.push(`${friendlyName(id)} available`);
    }
  }
  return alerts;
}

function renderHomeScreen() {
  const weatherId = config.entities.weather || "weather.forecast_home";
  const weather = states[weatherId];
  const temp = weather && weather.attributes && weather.attributes.temperature != null ? `${weather.attributes.temperature}°` : "--";
  const humidity = weather && weather.attributes && weather.attributes.humidity != null ? `${weather.attributes.humidity}%` : "--";
  const condition = weather ? weather.state.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()) : "--";
  const icon = weatherIcon(weather ? weather.state : "");

  const presence = getPresenceEntities().map(id => {
    const state = states[id];
    const home = state ? isActive(state.state) : false;
    return `<div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:1.1rem;">
      ${renderStatusLed(home ? "home" : "off")}
      <span>${escapeHtml(friendlyName(id))}</span>
      <span style="color:${home ? 'var(--green)' : 'var(--text-muted)'}">${home ? "HOME" : "AWAY"}</span>
    </div>`;
  }).join("");

  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: !config.layout.clock24h });
  const dateStr = now.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }).toUpperCase();

  const leftCol = `
    <div style="display:flex;flex-direction:column;justify-content:center;height:100%;">
      <div id="clock" style="font-family:var(--font-mono);font-size:clamp(4rem,10vw,7rem);line-height:0.9;color:var(--green);text-shadow:0 0 24px rgba(20,254,23,0.4);">${escapeHtml(timeStr)}</div>
      <div id="date" style="font-family:var(--font-mono);font-size:1.1rem;color:var(--text-muted);margin-top:8px;">${escapeHtml(dateStr)}</div>
    </div>
    ${renderTerminalPanel("WEATHER", `<div style="display:flex;align-items:center;gap:14px;"><div style="font-size:2.5rem;">${icon}</div><div><div style="font-size:1.8rem;color:var(--green);">${temp}</div><div style="color:var(--text-muted);font-family:var(--font-mono);">${escapeHtml(condition)} · HUM ${humidity}</div></div></div>`)}
  `;

  const main = `
    <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:14px;flex:1;min-height:0;">
      <div style="display:flex;flex-direction:column;gap:14px;min-height:0;">${leftCol}</div>
      <div style="min-height:0;">${renderRadarFrame()}</div>
    </div>
    <div>${renderAlertTicker(getAlerts())}</div>
    <div>${renderTerminalPanel("PRESENCE", `<div style="display:flex;gap:24px;flex-wrap:wrap;">${presence}</div>`)}</div>
  `;

  document.getElementById("home-screen").innerHTML = main;
  initRadarMap();
}

function renderControlScreen() {
  const scenes = (config.sections && config.sections.scenes && config.sections.scenes.entities) || [];
  const quick = (config.sections && config.sections.quickControls && config.sections.quickControls.entities) || [];
  const mediaId = config.entities.mediaPlayer || "media_player.living_room_fire_tv_living_room";

  const sceneButtons = scenes.map(id => renderSceneButton(id)).join("");
  const lightIds = quick.filter(id => id.startsWith("light."));
  const lightCards = lightIds.map(id => renderLightCard(id)).join("");
  const quickButtons = scenes.slice(0, 2).map(id => renderSceneButton(id)).join("");

  const main = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;min-height:0;">
      <div style="display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;">
        ${renderTerminalPanel("SCENES", `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">${sceneButtons}</div>`)}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;">
        ${renderTerminalPanel("LIGHTS", lightCards || "<div style='color:var(--text-muted)'>NO LIGHTS</div>")}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;">
        ${renderMediaCard(mediaId)}
        ${renderTerminalPanel("QUICK", quickButtons)}
      </div>
    </div>
  `;
  document.getElementById("control-screen").innerHTML = main;
}

function renderStatusScreen() {
  const environment = (config.sections && config.sections.environment && config.sections.environment.entities) || [];
  const system = (config.sections && config.sections.system && config.sections.system.entities) || [];

  const envGroups = {};
  const envOrder = [];
  for (const id of environment) {
    const area = entityArea(id) || "Other";
    if (!envGroups[area]) {
      envGroups[area] = [];
      envOrder.push(area);
    }
    envGroups[area].push(id);
  }
  const envMetrics = envOrder.map(area => {
    const metrics = envGroups[area].map(id => renderEnvMetric(id)).join("");
    return `<div style="margin-bottom:12px;">
      <div style="font-family:var(--font-mono);font-size:0.8rem;color:var(--green);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">${escapeHtml(area)}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">${metrics}</div>
    </div>`;
  }).join("");

  const sysMetrics = system.filter(id => id.startsWith("sensor.")).map(id => renderMetricCard(id)).join("");

  const vacuumIds = system.filter(id => id.startsWith("vacuum."));
  const vacuumCards = vacuumIds.map(id => {
    const state = states[id];
    return `<div class="terminal-panel" style="margin-bottom:10px;" data-entity-id="${id}">
      <div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);">
        <span>${escapeHtml(friendlyName(id))}</span>
        <span style="color:var(--green);">${state ? escapeHtml(state.state) : "--"}</span>
      </div>
    </div>`;
  }).join("");

  const printerIds = Object.keys(states).filter(id => id.startsWith("sensor.p1s_") && id.includes("print_status"));
  const printerCards = printerIds.map(id => {
    const state = states[id];
    const base = id.replace("print_status", "").replace(/_+$/, "");
    const progressId = Object.keys(states).find(x => x.startsWith(base) && x.includes("print_progress") && x !== id);
    const remainingId = Object.keys(states).find(x => x.startsWith(base) && x.includes("remaining_time") && x !== id);
    const progress = progressId && states[progressId] ? parseFloat(states[progressId].state) : null;
    const remaining = remainingId && states[remainingId] ? states[remainingId].state : null;
    const progressBar = progress != null && !isNaN(progress)
      ? `<div style="width:100%;height:8px;background:var(--green-dim);border-radius:4px;margin:8px 0;"><div style="width:${Math.min(100, Math.max(0, progress))}%;height:100%;background:var(--green);border-radius:4px;"></div></div><div style="color:var(--text-muted);font-size:0.75rem;">${progress}% ${remaining ? "· " + escapeHtml(remaining) + " left" : ""}</div>`
      : "";
    return `<div class="terminal-panel" style="margin-bottom:10px;" data-entity-id="${id}">
      <div class="panel-body" style="font-family:var(--font-mono);">
        <div style="color:var(--green);">${state ? escapeHtml(state.state) : "--"}</div>
        ${progressBar}
        <div style="color:var(--text-muted);font-size:0.8rem;">${escapeHtml(friendlyName(id))}</div>
      </div>
    </div>`;
  }).join("");

  const main = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;overflow:hidden;">
      <div style="min-height:0;overflow-y:auto;">${renderTerminalPanel("ENVIRONMENT", envMetrics)}</div>
      <div style="min-height:0;overflow-y:auto;">${renderTerminalPanel("SYSTEM", sysMetrics + vacuumCards + printerCards)}</div>
    </div>
  `;
  document.getElementById("status-screen").innerHTML = main;
}

function renderSecurityScreen() {
  const cameras = (config.sections && config.sections.cameras && config.sections.cameras.entities) || [];
  const security = (config.sections && config.sections.security && config.sections.security.entities) || [];

  const cameraFeeds = cameras.map(id => renderCameraFeed(id)).join("");
  const securityCards = security.map(id => {
    const domain = id.split(".")[0];
    if (domain === "switch" || domain === "siren" || domain === "button" || domain === "script") {
      return renderSceneButton(id);
    }
    return renderMetricCard(id);
  }).join("");

  const main = `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;min-height:0;overflow:hidden;">
      ${cameraFeeds}
    </div>
    <div style="min-height:0;overflow-y:auto;">${renderTerminalPanel("DOOR & MOTION STATUS", `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;">${securityCards}</div>`)}</div>
  `;
  document.getElementById("security-screen").innerHTML = main;
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  const target = document.getElementById(name + "-screen");
  if (!target) return;
  target.classList.add("active");
  currentScreen = name;
  if (name === "home") renderHomeScreen();
  else if (name === "control") renderControlScreen();
  else if (name === "security") renderSecurityScreen();
  else if (name === "status") renderStatusScreen();
}

function entityBelongsToScreen(entityId, screen) {
  const sectionMap = {
    home: [config.entities.weather, ...getPresenceEntities()],
    control: [
      ...((config.sections.scenes && config.sections.scenes.entities) || []),
      ...((config.sections.quickControls && config.sections.quickControls.entities) || []),
      config.entities.mediaPlayer
    ],
    security: [
      ...((config.sections.cameras && config.sections.cameras.entities) || []),
      ...((config.sections.security && config.sections.security.entities) || [])
    ],
    status: [
      ...((config.sections.environment && config.sections.environment.entities) || []),
      ...((config.sections.system && config.sections.system.entities) || [])
    ]
  };
  const ids = sectionMap[screen] || [];
  if (ids.includes(entityId)) return true;
  if (screen === "home") {
    const sec = (config.sections.security && config.sections.security.entities) || [];
    const sys = (config.sections.system && config.sections.system.entities) || [];
    if (sec.includes(entityId) || sys.includes(entityId)) return true;
  }
  return false;
}

function updateCard(state) {
  if (!entityBelongsToScreen(state.entity_id, currentScreen)) return;
  if (currentScreen === "home") renderHomeScreen();
  else if (currentScreen === "control") renderControlScreen();
  else if (currentScreen === "security") renderSecurityScreen();
  else if (currentScreen === "status") renderStatusScreen();
}

function renderAll() {
  if (currentScreen === "home") renderHomeScreen();
  else if (currentScreen === "control") renderControlScreen();
  else if (currentScreen === "security") renderSecurityScreen();
  else if (currentScreen === "status") renderStatusScreen();
  updateClock();
}

function updateClock() {
  const now = new Date();
  const opts = config.layout.clock24h ? { hour: "2-digit", minute: "2-digit", hour12: false } : { hour: "numeric", minute: "2-digit" };
  const el = document.getElementById("clock");
  if (el) el.textContent = now.toLocaleTimeString([], opts);
  const d = document.getElementById("date");
  if (d) d.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
}

// ---- Settings ----

function openSettings() {
  buildSettings();
  document.getElementById("settings-overlay").style.display = "flex";
}
function closeSettings() {
  document.getElementById("settings-overlay").style.display = "none";
}

function buildSettings() {
  const body = document.getElementById("settings-body");
  const entityOptions = (domainFilter) => {
    let list = Object.values(states);
    if (domainFilter) list = list.filter(s => domainFilter.includes(s.entity_id.split(".")[0]));
    return list.map(s => `<option value="${s.entity_id}" ${s.entity_id === config.entities.weather ? "selected" : ""}>${escapeHtml(friendlyName(s.entity_id))} (${s.entity_id})</option>`).join("");
  };
  const quickChips = (config.entities.quickControls || []).map(id =>
    `<span class="entity-chip">${escapeHtml(friendlyName(id))} <button onclick="removeQuick('${id}')">×</button></span>`
  ).join("");
  body.innerHTML = `
    <div class="settings-section" style="margin-bottom:22px;"><h3 style="font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--green);margin:0 0 10px;">Appearance</h3>
      <div class="settings-row" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><label style="min-width:120px;font-size:0.9rem;color:var(--text-muted);">Accent color</label><input id="cfg-accent" type="color" value="${config.theme.accentColor}"></div>
      <div class="settings-row" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><label style="min-width:120px;font-size:0.9rem;color:var(--text-muted);">24-hour clock</label><input id="cfg-24h" type="checkbox" ${config.layout.clock24h ? "checked" : ""}></div>
    </div>
    <div class="settings-section" style="margin-bottom:22px;"><h3 style="font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--green);margin:0 0 10px;">Layout</h3>
      <div class="settings-row" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><label style="min-width:120px;font-size:0.9rem;color:var(--text-muted);">Weather entity</label><select id="cfg-weather"><option value="">-- none --</option>${entityOptions(["weather"])}</select></div>
      <div class="settings-row" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><label style="min-width:120px;font-size:0.9rem;color:var(--text-muted);">Media player</label><select id="cfg-media"><option value="">-- none --</option>${entityOptions(["media_player"])}</select></div>
    </div>
    <div class="settings-section" style="margin-bottom:22px;"><h3 style="font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--green);margin:0 0 10px;">Quick Controls</h3><div id="quick-list">${quickChips}</div>
      <div class="settings-row" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><select id="cfg-add-quick"><option value="">Add entity...</option>${entityOptions(["light","switch","scene","script","fan","input_boolean","button"])}</select></div>
    </div>
    <div class="settings-section" style="margin-bottom:22px;"><h3 style="font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--green);margin:0 0 10px;">Data</h3>
      <p style="color:var(--text-muted);font-size:0.85rem;">Settings are saved in this browser. Use Export to get a JSON file you can save as <code>config.json</code> in this folder.</p>
      <button class="btn" onclick="logout()" style="background:rgba(248,113,113,0.15);border-color:rgba(248,113,113,0.3);">Clear token & reload</button>
    </div>
  `;
  document.getElementById("cfg-weather").value = config.entities.weather || "";
  document.getElementById("cfg-media").value = config.entities.mediaPlayer || "";
  document.getElementById("cfg-add-quick").addEventListener("change", e => { if(e.target.value) addQuick(e.target.value); e.target.value=""; });
}

function addQuick(id) {
  if (!config.entities.quickControls.includes(id)) config.entities.quickControls.push(id);
  buildSettings();
}
function removeQuick(id) {
  config.entities.quickControls = config.entities.quickControls.filter(x => x !== id);
  buildSettings();
}

function saveSettings() {
  config.theme.accentColor = document.getElementById("cfg-accent").value;
  config.layout.clock24h = document.getElementById("cfg-24h").checked;
  config.entities.weather = document.getElementById("cfg-weather").value || "";
  config.entities.mediaPlayer = document.getElementById("cfg-media").value || "";
  saveConfig();
  applyTheme();
  renderAll();
  closeSettings();
}

function exportConfig() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "dashboard-config.json"; a.click();
  URL.revokeObjectURL(url);
}

function importConfig() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json";
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    try {
      const txt = await file.text();
      const data = JSON.parse(txt);
      config = deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), data);
      saveConfig();
      applyTheme();
      renderAll();
      buildSettings();
    } catch (e) { alert("Invalid JSON: " + e.message); }
  };
  input.click();
}

function logout() {
  localStorage.removeItem("ha_token");
  location.reload();
}

// ---- Connection ----

function connectProxy() {
  setStatus("connecting");
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ai-dashboard/ws";
  ws = new WebSocket(url);
  ws.onopen = () => {
    setStatus("connected");
    ws.send(JSON.stringify({ id: 1, type: "get_states" }));
    ws.send(JSON.stringify({ id: 2, type: "subscribe_events", event_type: "state_changed" }));
  };
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "result" && msg.id === 1 && msg.success) {
      states = {};
      for (const s of msg.result) states[s.entity_id] = s;
      await fetchRegistry();
      await refreshForecast();
      renderAll();
    }
    if (msg.type === "event" && msg.event && msg.event.event_type === "state_changed") {
      const s = msg.event.data.new_state;
      if (s) { states[s.entity_id] = s; updateCard(s); }
    }
  };
  ws.onclose = () => {
    setStatus("disconnected");
    setTimeout(connectProxy, Math.min(reconnectDelay, 30000));
    reconnectDelay *= 2;
  };
  ws.onerror = () => { setStatus("disconnected"); ws.close(); };
}

function connect() {
  if (window.HA_INTEGRATION_PROXY) return connectProxy();
  setStatus("connecting");
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/websocket";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ type: "auth", access_token: token }));
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "auth_ok") {
      setStatus("connected");
      ws.send(JSON.stringify({ id: 1, type: "get_states" }));
      ws.send(JSON.stringify({ id: 2, type: "subscribe_events", event_type: "state_changed" }));
      await fetchRegistry();
    }
    if (msg.type === "result" && msg.id === 1 && msg.success) {
      states = {};
      for (const s of msg.result) states[s.entity_id] = s;
      await refreshForecast();
      renderAll();
    }
    if (msg.type === "event" && msg.event && msg.event.event_type === "state_changed") {
      const s = msg.event.data.new_state;
      if (s) { states[s.entity_id] = s; updateCard(s); }
    }
  };
  ws.onclose = () => {
    setStatus("disconnected");
    setTimeout(connect, Math.min(reconnectDelay, 30000));
    reconnectDelay *= 2;
  };
  ws.onerror = () => { setStatus("disconnected"); ws.close(); };
}

// ---- Init ----

async function init() {
  config = await loadConfig();
  applyTheme();
  await fetchHAConfig();
  document.getElementById("dock").innerHTML =
    renderBottomButton("HOME", "home") +
    renderBottomButton("CONTROL HUB", "control") +
    renderBottomButton("SECURITY", "security") +
    renderBottomButton("STATUS MONITOR", "status");
  showScreen("home");
  setInterval(refreshForecast, 15 * 60 * 1000);
  if (window.HA_INTEGRATION_PROXY) {
    token = "";
    localStorage.removeItem("ha_token");
    connect();
  } else {
    token = localStorage.getItem("ha_token");
    if (!token) {
      token = prompt("Enter Home Assistant long-lived access token:");
      if (token) localStorage.setItem("ha_token", token);
    }
    if (token) connect();
  }
  setInterval(updateClock, 1000);
}

document.addEventListener("DOMContentLoaded", init);
</script>
