<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Assistant Wall Dashboard</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" />
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div id="status-led" class="status-led" style="position:fixed;top:14px;left:14px;z-index:50;"></div>
<div id="status-text" style="position:fixed;top:12px;left:32px;z-index:50;font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);">CONNECTING</div>
<div id="conn-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(255,174,0,0.12);border:1px solid var(--amber);color:var(--amber);font-family:var(--font-mono);padding:10px 14px;letter-spacing:0.05em;text-align:center;">! CONNECTION LOST — RETRYING</div>

<div id="app">
  <div id="home-screen" class="screen active"></div>
  <div id="control-screen" class="screen">CONTROL HUB</div>
  <div id="security-screen" class="screen">SECURITY</div>
  <div id="status-screen" class="screen">STATUS MONITOR</div>
  <div id="dock" style="display:flex;gap:14px;height:82px;flex-shrink:0;"></div>
  <!-- CRT overlays must be the last children of #app: #app forms its own
       stacking context, so overlays outside it would paint above ALL app
       content and the camera-feed/radar-map z-index:1001 lift could never
       win. Inside #app, z-index 999/1000 still covers normal content while
       1001 elements (camera feeds, radar map) render clear. -->
  <div class="vignette"></div>
  <div class="scanlines"></div>
</div>

<div id="settings-overlay" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;">
  <div id="settings-panel" class="terminal-panel" style="width:min(1440px,96vw);height:88vh;display:flex;flex-direction:column;">
    <div class="settings-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h2 class="settings-title" style="font-size:1.2rem;font-weight:700;margin:0;font-family:var(--font-mono);">Dashboard Settings</h2>
      <button class="settings-close" onclick="closeSettings()">Close</button>
    </div>
    <div id="settings-tabs" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;"></div>
    <div id="settings-body" style="overflow-y:auto;flex:1;min-height:0;"></div>
    <div id="settings-status" style="color:var(--amber);font-family:var(--font-mono);font-size:0.8rem;margin-top:12px;min-height:1em;"></div>
    <div class="settings-row" style="display:flex;gap:12px;justify-content:flex-end;margin-top:10px;">
      <button class="btn btn-primary" onclick="saveSettings()">Save & Apply</button>
    </div>
  </div>
</div>

<script>
  // Surface module-load failures on the wall tablet instead of a black screen.
  window.addEventListener('error', (e) => {
    const banner = document.getElementById('conn-banner');
    if (banner) {
      banner.textContent = 'DASHBOARD LOAD ERROR: ' + (e.message || 'module failed to load');
      banner.style.display = 'block';
    }
  }, true);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
