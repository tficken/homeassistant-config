<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1c1c1c"/>
  <!-- Living Room -->
  <rect x="20" y="20" width="300" height="260" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <text x="170" y="45" fill="#aaa" font-size="16" text-anchor="middle">Living Room</text>
  <!-- Travis Office -->
  <rect x="340" y="20" width="260" height="260" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <text x="470" y="45" fill="#aaa" font-size="16" text-anchor="middle">Travis Office</text>
  <!-- Kitchen -->
  <rect x="620" y="20" width="160" height="200" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <text x="700" y="45" fill="#aaa" font-size="16" text-anchor="middle">Kitchen</text>
  <!-- Bedroom -->
  <rect x="500" y="240" width="280" height="200" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <text x="640" y="265" fill="#aaa" font-size="16" text-anchor="middle">Bedroom</text>
  <!-- Basement -->
  <rect x="20" y="300" width="460" height="200" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <text x="250" y="325" fill="#aaa" font-size="16" text-anchor="middle">Basement</text>
  <!-- Entry -->
  <rect x="20" y="520" width="120" height="60" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <text x="80" y="545" fill="#aaa" font-size="14" text-anchor="middle">Entry</text>
  <!-- Door -->
  <line x1="140" y1="550" x2="180" y2="550" stroke="#777" stroke-width="4"/>
</svg>
