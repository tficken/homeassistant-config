- id: bambu_p1s_uno_print_error
  alias: Bambu P1S UNO print error
  description: Notify when the P1S UNO reports a print or HMS error
  use_blueprint:
    path: bambu_print_error.yaml
    input:
      printer_name: P1S UNO
      print_status_entity: sensor.travis_office_p1s_uno_print_status
      error_binary_sensors:
        - binary_sensor.travis_office_p1s_uno_print_error
        - binary_sensor.travis_office_p1s_uno_hms_errors
      notification_id: bambu_p1s_uno_print_error
      notify_service: notify.mobile_app_traviss_iphone

- id: wall_panel_day_backlight
  alias: Wall panel day backlight
  description: Set the CrowPanel display backlight to bright during the day
  triggers:
    - trigger: time
      at: "07:00:00"
    - trigger: sun
      event: sunrise
  conditions:
    - condition: sun
      after: sunrise
      before: sunset
  actions:
    - action: light.turn_on
      target:
        entity_id: light.crowpanel_hasp_display_backlight
      data:
        brightness: 200
  mode: single

- id: wall_panel_night_backlight
  alias: Wall panel night backlight
  description: Dim the CrowPanel display backlight at night
  triggers:
    - trigger: time
      at: "22:00:00"
  conditions: []
  actions:
    - action: light.turn_on
      target:
        entity_id: light.crowpanel_hasp_display_backlight
      data:
        brightness: 50
  mode: single

- id: '1786780000002'
  alias: PD New Incident announcement
  description: Flash the office ceiling fan red 3 times and announce over the master bedroom Echo Dot when a new high-urgency PagerDuty incident is assigned, restoring the prior light state and Echo volume afterwards
  triggers:
  - trigger: state
    entity_id:
    - sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  - condition: template
    value_template: >-
      {% set incs = state_attr('sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents', 'assigned_incidents') or [] %}
      {{ incs | selectattr('urgency', 'eq', 'high') | list | count > 0 }}
  actions:
  - action: scene.create
    data:
      scene_id: pagerduty_flash_restore
      snapshot_entities:
      - light.ceiling_fan
  - repeat:
      count: 3
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ceiling_fan
        data:
          brightness_pct: 100
          color_name: red
        continue_on_error: true
      - delay: 00:00:00.500
      - action: light.turn_off
        target:
          entity_id: light.ceiling_fan
        continue_on_error: true
      - delay: 00:00:00.500
  - action: scene.turn_on
    target:
      entity_id: scene.pagerduty_flash_restore
  - action: script.echo_dot_announce
    data:
      message: New PagerDuty Alert
      volume: 0.8
  mode: single

- id: '1786780000001'
  alias: Door/window open announcement
  description: Announce door/window openings over Alexa and notify phone only when no one is home or night mode is on
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_front_door
    - binary_sensor.backdoor
    to: 'on'
  conditions: []
  actions:
  - variables:
      name: "{{ trigger.to_state.attributes.friendly_name | default(trigger.to_state.name) }}"
      message: "{{ name }} is open"
  - if:
      - condition: template
        value_template: "{{ (is_state('person.woteg', 'not_home') and is_state('person.bobbie', 'not_home')) or is_state('input_boolean.night_mode', 'on') }}"
    then:
      - action: script.echo_dot_announce
        data:
          message: "{{ message }}"
          volume: 0.7
      - action: notify.mobile_app_traviss_iphone
        data:
          title: Door/Window Open
          message: "{{ message }}"
  mode: single

- id: goodnight_morning_reset
  alias: Goodnight morning reset
  description: Turn off night_mode and stop brown noise at sunrise (motion detection stays on 24/7 so doorbell recordings keep updating)
  triggers:
    - trigger: sun
      event: sunrise
  conditions:
    - condition: state
      entity_id: input_boolean.night_mode
      state: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.night_mode
    - action: media_player.media_stop
      target:
        entity_id: media_player.master_bedroom_echo_dot
      continue_on_error: true
  mode: single

- id: ring_snapshot_archive_front_door
  alias: Ring snapshot archive - front door
  description: Record a 10s video clip to the AI dashboard history archive on front door motion or ding
  use_blueprint:
    path: ring_snapshot_archive.yaml
    input:
      trigger_entities:
        - binary_sensor.front_door_motion
        - binary_sensor.front_door_ding
      live_stream_switch: switch.front_door_live_stream
      camera_entity: camera.front_door_rtsp_live
      snapshot_key: front_door
      stream_timeout_notification_id: ring_archive_front_door_stream_timeout
      stream_timeout_message: "The front door stream did not report ready within 20s after motion/ding; the archived clip may be missing or incomplete."

- id: ring_snapshot_archive_backyard
  alias: Ring snapshot archive - backyard
  description: Record a 10s video clip to the AI dashboard history archive on backyard motion
  use_blueprint:
    path: ring_snapshot_archive.yaml
    input:
      trigger_entities:
        - binary_sensor.downstairs_motion
      live_stream_switch: switch.downstairs_live_stream
      camera_entity: camera.backyard_live_stream
      snapshot_key: backyard
      stream_timeout_notification_id: ring_archive_backyard_stream_timeout
      stream_timeout_message: "The backyard stream did not report ready within 20s after motion; the archived clip may be missing or incomplete."

- id: stale_backup_alert
  alias: Stale backup alert
  description: Notify when the newest backup is more than 8 days old (catches the weekly backup never running, which the backup script itself cannot report)
  triggers:
    - trigger: time
      at: "09:00:00"
  conditions:
    - condition: numeric_state
      entity_id: sensor.ha_last_backup_age
      above: 8
  actions:
    - action: persistent_notification.create
      data:
        title: Backup overdue
        message: "The newest Home Assistant backup is {{ states('sensor.ha_last_backup_age') }} days old — the weekly backup may not be running."
        notification_id: stale_backup_alert
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Backup overdue
        message: "The newest Home Assistant backup is {{ states('sensor.ha_last_backup_age') }} days old — the weekly backup may not be running."
  mode: single

- id: ring_live_stream_failsafe
  alias: Ring live stream failsafe
  description: Force off Ring live-stream switches left on >12 min (e.g. a wall tablet that slept mid-view never sends its close call; motion events are suppressed while streaming)
  triggers:
    - trigger: state
      entity_id:
        - switch.front_door_live_stream
        - switch.downstairs_live_stream
      to: "on"
      for: "00:12:00"
  conditions: []
  actions:
    - action: switch.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Live stream force-stopped
        message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} was on for over 12 minutes and has been turned off."
  mode: single

- id: away_mode
  alias: Away mode
  description: When everyone has been gone for 5 minutes — lights off, media stop, Ring motion detection on
  triggers:
    - trigger: state
      entity_id:
        - person.woteg
        - person.bobbie
      to: "not_home"
      for: "00:05:00"
  conditions:
    - condition: state
      entity_id: person.woteg
      state: "not_home"
    - condition: state
      entity_id: person.bobbie
      state: "not_home"
  actions:
    - action: scene.create
      data:
        scene_id: away_mode_light_snapshot
        snapshot_entities: "{{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
    - action: light.turn_off
      target:
        entity_id: all
      data:
        transition: 2
    - action: media_player.media_stop
      target:
        entity_id: all
      continue_on_error: true
    - action: switch.turn_on
      target:
        entity_id:
          - switch.front_door_motion_detection
          - switch.downstairs_motion_detection
      continue_on_error: true
    - variables:
        prev_volume: "{{ state_attr('media_player.master_bedroom_echo_dot', 'volume_level') | float(0.4) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.master_bedroom_echo_dot_volume
      data:
        value: "{{ prev_volume }}"
    - action: notify.alexa_media_master_bedroom_echo_dot
      data:
        message: "Away mode enabled. Lights off, motion detection on."
        data:
          type: announce
      continue_on_error: true
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Away mode
        message: "Everyone left — lights off, media stopped, motion detection on."
    - action: media_player.volume_set
      target:
        entity_id: media_player.master_bedroom_echo_dot
      data:
        volume_level: 0.2
      continue_on_error: true
  mode: single

- id: welcome_home
  alias: Welcome home
  description: First person arrives home after everyone was away — restore lights that were on when everyone left (motion detection intentionally untouched; it stays on 24/7)
  triggers:
    - trigger: state
      entity_id:
        - person.woteg
        - person.bobbie
      to: "home"
  conditions:
    - condition: template
      value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'home' }}"
    # Both were away before this arrival: the other person is still not_home
    - condition: template
      value_template: >
        {% set other = 'person.bobbie' if trigger.entity_id == 'person.woteg' else 'person.woteg' %}
        {{ is_state(other, 'not_home') }}
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.master_bedroom_echo_dot
      data:
        volume_level: "{{ states('input_number.master_bedroom_echo_dot_volume') | float(0.4) }}"
      continue_on_error: true
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: time
                  after: "22:00:00"
                - condition: sun
                  before: sunrise
          sequence:
            - action: notify.alexa_media_master_bedroom_echo_dot
              data:
                message: "Welcome home. Turning on a dim path."
                data:
                  type: announce
              continue_on_error: true
            - action: light.turn_on
              target:
                entity_id: light.living_room_ceiling_fan
              data:
                brightness_pct: 10
                transition: 2
      default:
        - action: scene.turn_on
          target:
            entity_id: scene.away_mode_light_snapshot
          continue_on_error: true
    - action: notify.alexa_media_master_bedroom_echo_dot
      data:
        message: "Welcome home, {{ state_attr(trigger.entity_id, 'friendly_name') | default('') }}."
        data:
          type: announce
      continue_on_error: true
  mode: single

- id: goodnight_auto_trigger
  alias: Goodnight auto-trigger
  description: When the house has been still after 10 PM, warn and then run the goodnight routine
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.hobeian_zg_204zx
        - binary_sensor.hobeian_zg_204zx_2
        - binary_sensor.hobeian_zg_204zx_3
        - binary_sensor.hobeian_zg_204zx_4
      to: "off"
      for: "00:30:00"
  conditions:
    - condition: time
      after: "22:00:00"
      before: "06:00:00"
    - condition: template
      value_template: "{{ is_state('person.woteg', 'home') or is_state('person.bobbie', 'home') }}"
    - condition: state
      entity_id: input_boolean.night_mode
      state: "off"
    - condition: template
      value_template: >
        {{ states.binary_sensor
           | selectattr('attributes.device_class', 'eq', 'motion')
           | selectattr('entity_id', 'match', 'hobeian')
           | selectattr('state', 'eq', 'on')
           | list | length == 0 }}
  actions:
    - action: notify.alexa_media_master_bedroom_echo_dot
      data:
        message: "Goodnight mode will activate in 30 seconds."
        data:
          type: announce
      continue_on_error: true
    - delay: "00:00:30"
    - action: script.goodnight
  mode: single

- id: printer_chamber_light_auto_off
  alias: Printer chamber light auto-off
  description: Turn off the printer chamber light when a print ends (finished, idle, or failed)
  triggers:
    - trigger: state
      entity_id:
        - sensor.p1s_01p00a412300832_print_status
        - sensor.travis_office_p1s_uno_print_status
      to:
        - finish
        - finished
        - completed
        - idle
        - success
        - failed
        - error
        - fault
  conditions:
    - condition: template
      value_template: >
        {{ trigger.from_state is not none and trigger.to_state is not none and
           (trigger.from_state.state | lower) in ['running', 'printing', 'pause', 'paused'] and
           (trigger.to_state.state | lower) in ['finish', 'finished', 'completed', 'idle', 'success', 'failed', 'error', 'fault'] }}
  actions:
    - action: light.turn_off
      target:
        entity_id: >
          {{ 'light.p1s_01p00a412300832_chamber_light'
             if trigger.entity_id == 'sensor.p1s_01p00a412300832_print_status'
             else 'light.travis_office_p1s_uno_chamber_light' }}
      continue_on_error: true
  mode: single

- id: monthly_statement_reminder
  alias: Monthly statement reminder
  description: Remind on the 2nd of each month to download last month's bank statement and upload it on the budget page for spending history
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - condition: template
      value_template: "{{ now().day == 2 }}"
  actions:
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Statement time
        message: "Download last month's bank statement and upload it on the budget page."
        data:
          url: /budget/
  mode: single

- id: bank_feed_stale_alert
  alias: Bank feed stale alert
  description: Notify when the SimpleFIN bank feed stops updating — safe-to-spend numbers go stale silently otherwise
  triggers:
    - trigger: state
      entity_id: binary_sensor.west_gate_bank_checking_2075_possible_error
      to: "on"
      id: error
    - trigger: time
      at: "09:00:00"
      id: daily
  conditions:
    - condition: template
      value_template: >
        {% set age_ts = as_timestamp(states('sensor.west_gate_bank_checking_2075_data_age'), none) %}
        {{ states('binary_sensor.west_gate_bank_checking_2075_possible_error') == 'on'
           or age_ts is none
           or now().timestamp() - age_ts > 172800 }}
  actions:
    - action: persistent_notification.create
      data:
        title: Bank feed stale
        message: "SimpleFIN data for West Gate checking is stale or erroring (last update: {{ states('sensor.west_gate_bank_checking_2075_data_age') }}) — safe-to-spend numbers may be wrong."
        notification_id: bank_feed_stale_alert
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Bank feed stale
        message: "SimpleFIN data for West Gate checking is stale or erroring — safe-to-spend numbers may be wrong."
  mode: single
