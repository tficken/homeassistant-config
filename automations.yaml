- id: wall_panel_push_pages_on_startup
  alias: Wall panel push pages on startup
  description: Push the pages.jsonl layout to the wall panel after HA starts
  triggers:
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - delay: "00:00:10"
    - service: openhasp.load_pages
      target:
        entity_id: openhasp.wall_panel
      data:
        path: /config/openhasp/wall_panel/pages.jsonl
  mode: single

- id: wall_panel_day_backlight
  alias: Wall panel day backlight
  description: Set panel backlight to bright during the day
  triggers:
    - trigger: time
      at: "07:00:00"
    - trigger: sun
      event: sunrise
  conditions:
    - condition: sun
      after: sunrise
      before: sunset
  actions:
    - service: mqtt.publish
      data:
        topic: hasp/wall_panel/command
        payload: "backlight {'state':1,'brightness':200}"
  mode: single

- id: wall_panel_night_backlight
  alias: Wall panel night backlight
  description: Dim panel backlight at night
  triggers:
    - trigger: time
      at: "22:00:00"
  conditions: []
  actions:
    - service: mqtt.publish
      data:
        topic: hasp/wall_panel/command
        payload: "backlight {'state':1,'brightness':50}"
  mode: single

- id: '1786652844327'
  alias: PD New Incident
  description: Flash the office ceiling fan red 3 times when a new PagerDuty incident is assigned, then restore prior state.
  triggers:
  - trigger: state
    entity_id:
    - sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  actions:
  - action: scene.create
    data:
      scene_id: pagerduty_flash_restore
      snapshot_entities:
      - light.ceiling_fan
  - repeat:
      count: 3
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ceiling_fan
        data:
          brightness_pct: 100
          color_name: red
      - delay: 00:00:00.500
      - action: light.turn_off
        target:
          entity_id: light.ceiling_fan
      - delay: 00:00:00.500
  - action: scene.turn_on
    target:
      entity_id: scene.pagerduty_flash_restore
  mode: single

- id: '1786780000001'
  alias: Door/window open announcement
  description: Announce door/window openings over Alexa and notify phone only when no one is home
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_front_door
    - binary_sensor.backdoor
    to: 'on'
  conditions: []
  actions:
  - variables:
      name: "{{ trigger.to_state.attributes.friendly_name | default(trigger.to_state.name) }}"
      message: "{{ name }} is open"
  - action: notify.alexa_media_everywhere
    data:
      message: "{{ message }}"
      data:
        type: announce
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ is_state('person.woteg', 'not_home') and is_state('person.bobbie', 'not_home') }}"
      sequence:
      - action: notify.mobile_app_traviss_iphone
        data:
          title: Door/Window Open
          message: "{{ message }}"
  mode: single
