- id: wall_panel_push_pages_on_startup
  alias: Wall panel push pages on startup
  description: Push the pages.jsonl layout to the wall panel after HA starts
  triggers:
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - delay: "00:00:10"
    - service: openhasp.load_pages
      target:
        entity_id: openhasp.wall_panel
      data:
        path: /config/openhasp/wall_panel/pages.jsonl
  mode: single

- id: wall_panel_day_backlight
  alias: Wall panel day backlight
  description: Set panel backlight to bright during the day
  triggers:
    - trigger: time
      at: "07:00:00"
    - trigger: sun
      event: sunrise
  conditions:
    - condition: sun
      after: sunrise
      before: sunset
  actions:
    - service: mqtt.publish
      data:
        topic: hasp/wall_panel/command
        payload: "backlight {'state':1,'brightness':200}"
  mode: single

- id: wall_panel_night_backlight
  alias: Wall panel night backlight
  description: Dim panel backlight at night
  triggers:
    - trigger: time
      at: "22:00:00"
  conditions: []
  actions:
    - service: mqtt.publish
      data:
        topic: hasp/wall_panel/command
        payload: "backlight {'state':1,'brightness':50}"
  mode: single

- id: '1786652844327'
  alias: PD New Incident
  description: Flash the office ceiling fan red 3 times when a new high-urgency PagerDuty incident is assigned, then restore prior state.
  triggers:
  - trigger: state
    entity_id:
    - sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  - condition: template
    value_template: >-
      {% set incs = state_attr('sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents', 'assigned_incidents') or [] %}
      {{ incs | length > 0 and incs[0].urgency == 'high' }}
  actions:
  - action: scene.create
    data:
      scene_id: pagerduty_flash_restore
      snapshot_entities:
      - light.ceiling_fan
  - repeat:
      count: 3
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ceiling_fan
        data:
          brightness_pct: 100
          color_name: red
      - delay: 00:00:00.500
      - action: light.turn_off
        target:
          entity_id: light.ceiling_fan
      - delay: 00:00:00.500
  - action: scene.turn_on
    target:
      entity_id: scene.pagerduty_flash_restore
  mode: single

- id: '1786780000002'
  alias: PD New Incident announcement
  description: Announce new high-urgency PagerDuty incidents over the master bedroom Echo Dot, restoring its prior volume afterwards
  triggers:
  - trigger: state
    entity_id:
    - sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  - condition: template
    value_template: >-
      {% set incs = state_attr('sensor.pagerduty_p2wm8b3_pagerduty_assigned_incidents', 'assigned_incidents') or [] %}
      {{ incs | length > 0 and incs[0].urgency == 'high' }}
  actions:
  - variables:
      prev_volume: "{{ state_attr('media_player.master_bedroom_echo_dot', 'volume_level') }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.master_bedroom_echo_dot
    data:
      volume_level: 0.8
  - action: notify.alexa_media_master_bedroom_echo_dot
    data:
      message: New PagerDuty Alert
      data:
        type: announce
  - delay: "00:00:08"
  - condition: template
    value_template: "{{ prev_volume is not none }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.master_bedroom_echo_dot
    data:
      volume_level: "{{ prev_volume }}"
  mode: single

- id: '1786780000001'
  alias: Door/window open announcement
  description: Announce door/window openings over Alexa and notify phone when no one is home or night mode is on
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_front_door
    - binary_sensor.backdoor
    to: 'on'
  conditions: []
  actions:
  - variables:
      name: "{{ trigger.to_state.attributes.friendly_name | default(trigger.to_state.name) }}"
      message: "{{ name }} is open"
      prev_volume: "{{ state_attr('media_player.master_bedroom_echo_dot', 'volume_level') }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.master_bedroom_echo_dot
    data:
      volume_level: 0.7
  - action: notify.alexa_media_master_bedroom_echo_dot
    data:
      message: "{{ message }}"
      data:
        type: announce
  - delay: "00:00:08"
  - condition: template
    value_template: "{{ prev_volume is not none }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.master_bedroom_echo_dot
    data:
      volume_level: "{{ prev_volume }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ (is_state('person.woteg', 'not_home') and is_state('person.bobbie', 'not_home')) or is_state('input_boolean.night_mode', 'on') }}"
      sequence:
      - action: notify.mobile_app_traviss_iphone
        data:
          title: Door/Window Open
          message: "{{ message }}"
  mode: single

- id: goodnight_morning_reset
  alias: Goodnight morning reset
  description: Turn off night_mode and stop brown noise at sunrise (motion detection stays on 24/7 so doorbell recordings keep updating)
  triggers:
    - trigger: sun
      event: sunrise
  conditions:
    - condition: state
      entity_id: input_boolean.night_mode
      state: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.night_mode
    - action: media_player.media_stop
      target:
        entity_id: media_player.master_bedroom_echo_dot
      continue_on_error: true
  mode: single

- id: ring_snapshot_archive_front_door
  alias: Ring snapshot archive - front door
  description: Record a 10s video clip to the AI dashboard history archive on front door motion or ding
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_motion
        - binary_sensor.front_door_ding
      to: "on"
  conditions: []
  actions:
    # ring-mqtt's RTSP path only exists while the live-stream switch is on:
    # spin it up, record a clip, then shut it back down (Ring kills streams
    # after ~10 min and suppresses events while streaming anyway)
    - action: switch.turn_on
      target:
        entity_id: switch.front_door_live_stream
      continue_on_error: true
    - delay: "00:00:08"
    - action: camera.record
      target:
        entity_id: camera.front_door_rtsp_live
      data:
        filename: "/config/www/ai-dashboard/snapshots/front_door/{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}.mp4"
        duration: 10
      continue_on_error: true
    - action: switch.turn_off
      target:
        entity_id: switch.front_door_live_stream
      continue_on_error: true
  mode: queued
  max: 5

- id: ring_snapshot_archive_backyard
  alias: Ring snapshot archive - backyard
  description: Record a 10s video clip to the AI dashboard history archive on backyard motion
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.downstairs_motion
      to: "on"
  conditions: []
  actions:
    # Same on-demand RTSP spin-up as the front door
    - action: switch.turn_on
      target:
        entity_id: switch.downstairs_live_stream
      continue_on_error: true
    - delay: "00:00:08"
    - action: camera.record
      target:
        entity_id: camera.backyard_live_stream
      data:
        filename: "/config/www/ai-dashboard/snapshots/backyard/{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}.mp4"
        duration: 10
      continue_on_error: true
    - action: switch.turn_off
      target:
        entity_id: switch.downstairs_live_stream
      continue_on_error: true
  mode: queued
  max: 5

- id: stale_backup_alert
  alias: Stale backup alert
  description: Notify when the newest backup is more than 8 days old (catches the weekly backup never running, which the backup script itself cannot report)
  triggers:
    - trigger: time
      at: "09:00:00"
  conditions:
    - condition: numeric_state
      entity_id: sensor.ha_last_backup_age
      above: 8
  actions:
    - action: persistent_notification.create
      data:
        title: Backup overdue
        message: "The newest Home Assistant backup is {{ states('sensor.ha_last_backup_age') }} days old — the weekly backup may not be running."
        notification_id: stale_backup_alert
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Backup overdue
        message: "The newest Home Assistant backup is {{ states('sensor.ha_last_backup_age') }} days old — the weekly backup may not be running."
  mode: single

- id: ring_live_stream_failsafe
  alias: Ring live stream failsafe
  description: Force off Ring live-stream switches left on >12 min (e.g. a wall tablet that slept mid-view never sends its close call; motion events are suppressed while streaming)
  triggers:
    - trigger: state
      entity_id:
        - switch.front_door_live_stream
        - switch.downstairs_live_stream
      to: "on"
      for: "00:12:00"
  conditions: []
  actions:
    - action: switch.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Live stream force-stopped
        message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} was on for over 12 minutes and has been turned off."
  mode: single
