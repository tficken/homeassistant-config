- id: cleanup_old_backups
  alias: Cleanup old backups
  description: Delete backups older than 14 days via Supervisor API
  triggers:
    - trigger: time
      at: "04:00:00"
  conditions: []
  actions:
    - action: shell_command.cleanup_old_backups
  mode: single

- id: weekly_backup
  alias: Weekly full backup
  description: Create a full backup every Sunday at 03:00
  triggers:
    - trigger: time
      at: "03:00:00"
  conditions:
    - condition: template
      value_template: "{{ now().weekday() == 6 }}"
  actions:
    - action: shell_command.create_weekly_backup
  mode: single

- id: disk_space_alert
  alias: Disk space alert
  description: Notify when HA disk usage exceeds 85%
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ha_disk_usage
      above: 85
  conditions: []
  actions:
    - action: persistent_notification.create
      data:
        title: Disk space warning
        message: "Home Assistant disk usage is at {{ states('sensor.ha_disk_usage') }}%."
        notification_id: disk_space_alert
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Disk space warning
        message: "Home Assistant disk usage is at {{ states('sensor.ha_disk_usage') }}%."
  mode: single

- id: low_battery_alert
  alias: Low battery alert
  description: Notify when any device battery drops below 20% or becomes unavailable
  triggers:
    - trigger: time
      at: "09:00:00"
    - trigger: numeric_state
      entity_id:
        - sensor.front_door_battery
        - sensor.front_door_battery_2
        - sensor.downstairs_battery
        - sensor.living_room_front_door_battery
        - sensor.backdoor_battery
        - sensor.hobeian_zg_204zx_battery
        - sensor.hobeian_zg_204zx_battery_2
        - sensor.hobeian_zg_204zx_battery_3
        - sensor.hobeian_zg_204zx_battery_4
        - sensor.traviss_iphone_battery_level
        - sensor.bobbies_iphone_battery_level
      below: 20
  conditions:
    - condition: template
      value_template: >
        {% set ns = namespace(low=[]) %}
        {% for s in states.sensor | selectattr('attributes.device_class', 'eq', 'battery') %}
          {% if s.state in ['unavailable', 'unknown'] or s.state | float(100) < 20 %}
            {% set ns.low = ns.low + [s] %}
          {% endif %}
        {% endfor %}
        {{ ns.low | length > 0 }}
  actions:
    - action: persistent_notification.create
      data:
        title: Low battery warning
        message: >
          {% for s in states.sensor | selectattr('attributes.device_class', 'eq', 'battery') %}
          {% if s.state in ['unavailable', 'unknown'] or s.state | float(100) < 20 %}
          - {{ s.attributes.friendly_name | default(s.entity_id) }}: {% if s.state in ['unavailable', 'unknown'] %}{{ s.state }}{% else %}{{ s.state | float(100) | round(0) }}%{% endif %}
          {% endif %}
          {% endfor %}
        notification_id: low_battery_alert
    - action: notify.mobile_app_traviss_iphone
      data:
        title: Low battery warning
        message: >
          {% set ns = namespace(names=[]) %}
          {% for s in states.sensor | selectattr('attributes.device_class', 'eq', 'battery') %}
          {% if s.state in ['unavailable', 'unknown'] or s.state | float(100) < 20 %}
            {% set ns.names = ns.names + [s.attributes.friendly_name | default(s.entity_id)] %}
          {% endif %}
          {% endfor %}
          {{ ns.names | join(', ') }} batter{% if ns.names | length > 1 %}ies are{% else %}y is{% endif %} low or unavailable.
  mode: single


- id: bambu_p1s_print_finished
  alias: Bambu P1S print finished
  description: Notify when the P1S print status moves from printing to finished/idle
  use_blueprint:
    path: bambu_print_finished.yaml
    input:
      printer_name: P1S
      print_status_entity: sensor.p1s_01p00a412300832_print_status
      notification_id: bambu_p1s_print_finished
      notify_service: notify.mobile_app_traviss_iphone

- id: bambu_p1s_print_error
  alias: Bambu P1S print error
  description: Notify when the P1S reports a print or HMS error
  use_blueprint:
    path: bambu_print_error.yaml
    input:
      printer_name: P1S
      print_status_entity: sensor.p1s_01p00a412300832_print_status
      error_binary_sensors:
        - binary_sensor.p1s_01p00a412300832_print_error
        - binary_sensor.p1s_01p00a412300832_hms_errors
      notification_id: bambu_p1s_print_error
      notify_service: notify.mobile_app_traviss_iphone

- id: bambu_p1s_uno_print_finished
  alias: Bambu P1S UNO print finished
  description: Notify when the P1S UNO print status moves from printing to finished/idle
  use_blueprint:
    path: bambu_print_finished.yaml
    input:
      printer_name: P1S UNO
      print_status_entity: sensor.travis_office_p1s_uno_print_status
      notification_id: bambu_p1s_uno_print_finished
