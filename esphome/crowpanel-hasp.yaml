text_sensor:
  # ----- Home Assistant imports: text states -----
  # Sun state drives the day/night suffix of the OWM weather icon.
  - platform: homeassistant
    id: ts_sun
    entity_id: sun.sun
    internal: true
    on_value:
      then:
        - script.execute: update_weather_icon

  - platform: homeassistant
    id: ts_weather_condition
    entity_id: weather.forecast_home
    attribute: condition
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: home_weather_cond
            text: !lambda |-
              if (x == "sunny") return std::string("Sunny");
              if (x == "clear-night") return std::string("Clear night");
              if (x == "partlycloudy") return std::string("Partly cloudy");
              if (x == "cloudy") return std::string("Cloudy");
              if (x == "fog") return std::string("Fog");
              if (x == "rainy") return std::string("Rain");
              if (x == "pouring") return std::string("Heavy rain");
              if (x == "snowy") return std::string("Snow");
              if (x == "snowy-rainy") return std::string("Snow & rain");
              if (x == "hail") return std::string("Hail");
              if (x == "lightning") return std::string("Thunderstorms");
              if (x == "lightning-rainy") return std::string("Storms & rain");
              if (x == "wind") return std::string("Windy");
              if (x == "wind-variant") return std::string("Windy");
              if (x == "exceptional") return std::string("Severe weather");
              return x.empty() ? std::string("—") : x;
        - script.execute: update_weather_icon

  - platform: homeassistant
    id: ts_person_woteg
    entity_id: person.woteg
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: home_travis
            text: !lambda |-
              return std::string("Travis: ") + ((x == "home") ? "Home" : "Away");
        - lvgl.widget.update:
            id: home_travis
            text_color: !lambda |-
              return (x == "home") ? lv_color_hex(0x14FE17) : lv_color_hex(0x5A7A5A);
        - lvgl.widget.update:
            id: dot_travis
            bg_color: !lambda |-
              return (x == "home") ? lv_color_hex(0x14FE17) : lv_color_hex(0x5A7A5A);

  - platform: homeassistant
    id: ts_person_bobbie
    entity_id: person.bobbie
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: home_bobbie
            text: !lambda |-
              return std::string("Bobbie: ") + ((x == "home") ? "Home" : "Away");
        - lvgl.widget.update:
            id: home_bobbie
            text_color: !lambda |-
              return (x == "home") ? lv_color_hex(0x14FE17) : lv_color_hex(0x5A7A5A);
        - lvgl.widget.update:
            id: dot_bobbie
            bg_color: !lambda |-
              return (x == "home") ? lv_color_hex(0x14FE17) : lv_color_hex(0x5A7A5A);

  # Light on/off states for the Lights page cards.
  - platform: homeassistant
    id: ts_ceiling_fan
    entity_id: light.ceiling_fan
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: ceiling_fan_state
            text: !lambda |-
              return (x == "on") ? std::string("On") : std::string("Off");

  - platform: homeassistant
    id: ts_lr_fan
    entity_id: light.living_room_ceiling_fan
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: lr_fan_state
            text: !lambda |-
              return (x == "on") ? std::string("On") : std::string("Off");

  # Ring last-activity timestamps. HA timestamp states arrive as ISO strings
  # in UTC (e.g. "2026-09-21T20:18:34+00:00"); the lambda trims them to
  # "MM-DD HH:MM" (UTC, not local time).
  - platform: homeassistant
    id: ts_front_last
    entity_id: sensor.front_door_last_activity
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: sec_front_last
            text: !lambda |-
              if (x.size() >= 16) {
                std::string out = x.substr(5, 11);
                out[5] = ' ';
                return out;
              }
              return x.empty() ? std::string("—") : x;

  - platform: homeassistant
    id: ts_downstairs_last
    entity_id: sensor.downstairs_last_activity
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: sec_downstairs_last
            text: !lambda |-
              if (x.size() >= 16) {
                std::string out = x.substr(5, 11);
                out[5] = ' ';
                return out;
              }
              return x.empty() ? std::string("—") : x;

binary_sensor:
  # ----- Home Assistant imports: binary states -----
  - platform: homeassistant
    id: bs_front_door
    entity_id: binary_sensor.living_room_front_door
    internal: true

    on_state:
      then:
        - lvgl.label.update:
            id: home_door_front
            text: !lambda |-
              return x ? std::string("Front Door: Open") : std::string("Front Door: Closed");
        - lvgl.widget.update:
            id: home_door_front
            text_color: !lambda |-
              return x ? lv_color_hex(0xFFAE00) : lv_color_hex(0x14FE17);
        - lvgl.widget.update:
            id: dot_door_front
            bg_color: !lambda |-
              return x ? lv_color_hex(0xFFAE00) : lv_color_hex(0x14FE17);
        - lvgl.label.update:
            id: sec_front_state
            text: !lambda |-
              return x ? std::string("Open") : std::string("Closed");
        - lvgl.widget.update:
            id: sec_front_state
            text_color: !lambda |-
              return x ? lv_color_hex(0xFFAE00) : lv_color_hex(0x14FE17);
        - lvgl.image.update:
            id: sec_front_icon
            src: !lambda |-
                return x ? id(icon_unlock) : id(icon_lock);

  - platform: homeassistant
    id: bs_backdoor
    entity_id: binary_sensor.backdoor
    internal: true

    on_state:
      then:
        - lvgl.label.update:
            id: home_door_back
            text: !lambda |-
              return x ? std::string("Back Door: Open") : std::string("Back Door: Closed");
        - lvgl.widget.update:
            id: home_door_back
            text_color: !lambda |-
              return x ? lv_color_hex(0xFFAE00) : lv_color_hex(0x14FE17);
        - lvgl.widget.update:
            id: dot_door_back
            bg_color: !lambda |-
              return x ? lv_color_hex(0xFFAE00) : lv_color_hex(0x14FE17);
        - lvgl.label.update:
            id: sec_back_state
            text: !lambda |-
              return x ? std::string("Open") : std::string("Closed");
        - lvgl.widget.update:
            id: sec_back_state
            text_color: !lambda |-
              return x ? lv_color_hex(0xFFAE00) : lv_color_hex(0x14FE17);
        - lvgl.image.update:
            id: sec_back_icon
            src: !lambda |-
                return x ? id(icon_unlock) : id(icon_lock);

  - platform: homeassistant
    id: bs_wan
    entity_id: binary_sensor.exos_router_wan_status
    internal: true

    on_state:
      then:
