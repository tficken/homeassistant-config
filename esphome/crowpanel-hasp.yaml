                  text_color: 0x5A7A5A
                  text: —
              - label:
                  id: home_weather_humidity
                  x: 200
                  y: 38
                  width: 156
                  text_align: RIGHT
                  text_font: font_small
                  text_color: 0xE8FFE8
                  text: "Hum: --"
              - label:
                  id: home_weather_wind
                  x: 200
                  y: 62
                  width: 156
                  text_align: RIGHT
                  text_font: font_small
                  text_color: 0xE8FFE8
                  text: "Wind: --"

        # Status card
        - obj:
            styles: card_style
            x: 410
            y: 170
            width: 370
            height: 150
            clickable: false
            widgets:
              - label:
                  x: 14
                  y: 10
                  text_font: font_small
                  text_color: 0x5A7A5A
