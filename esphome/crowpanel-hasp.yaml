script:
  # Maps the HA weather condition to one of the embedded weather icons and
  # points the weather card image widget at it. Called from
  # ts_weather_condition and ts_sun on_value triggers.
  - id: update_weather_icon
    mode: single
    then:
      - lvgl.image.update:
          id: weather_icon_img
          src: !lambda |-
              std::string cond = id(ts_weather_condition).state;
              if (cond == "sunny") return id(icon_sun);
              if (cond == "clear-night") return id(icon_moon);
              if (cond == "partlycloudy") return id(icon_partly_cloudy);
              if (cond == "cloudy") return id(icon_cloud);
              if (cond == "fog" || cond == "wind" || cond == "wind-variant") return id(icon_fog);
              if (cond == "rainy" || cond == "pouring") return id(icon_rain);
              if (cond == "snowy" || cond == "snowy-rainy" || cond == "hail") return id(icon_snow);
              if (cond == "lightning" || cond == "lightning-rainy" || cond == "exceptional") return id(icon_thunder);
              return id(icon_cloud);

  # Recomputes the alert banner from all four alert inputs; called from each
  # input's on_value/on_state. Starts hidden; first real evaluation happens as
  # soon as Home Assistant publishes initial states.
  - id: update_alert_banner
    mode: single
    then:
      - lvgl.widget.update:
          id: alert_banner
          hidden: !lambda |-
            bool backup_stale = id(ha_backup_age).state > 7.0f;
            bool disk_high = id(ha_disk_usage).state > 85.0f;
            bool wan_down = !id(bs_wan).state;
            bool nws_alerts = id(ha_nws_alerts).state > 0.0f;
            return !(backup_stale || disk_high || wan_down || nws_alerts);
      - lvgl.label.update:
          id: alert_banner_text
          text: !lambda |-
            std::string msg = "Alerts:";
            if (id(ha_backup_age).state > 7.0f) {
              msg += " backup stale,";
            }
            if (id(ha_disk_usage).state > 85.0f) {
              msg += " disk high,";
            }
            if (!id(bs_wan).state) {
              msg += " WAN down,";
            }
            if (id(ha_nws_alerts).state > 0.0f) {
              msg += " NWS alerts,";
            }
            if (msg.back() == ',') {
              msg.pop_back();
            }
            return msg;

  # Motion-armed summary line on the Home page (0/2, 1/2, 2/2).
  - id: update_motion_summary
    mode: single
    then:
      - lvgl.label.update:
          id: home_motion_summary
          text: !lambda |-
            int n = (id(sw_front_motion).state ? 1 : 0) + (id(sw_downstairs_motion).state ? 1 : 0);
            return std::string("Motion armed: ") + std::to_string(n) + "/2";
      - lvgl.widget.update:
          id: home_motion_summary
          text_color: !lambda |-
            int n = (id(sw_front_motion).state ? 1 : 0) + (id(sw_downstairs_motion).state ? 1 : 0);
            if (n == 2) {
              return lv_color_hex(0x14FE17);
            }
            if (n == 0) {
              return lv_color_hex(0xFFAE00);
            }
            return lv_color_hex(0x5A7A5A);
      - lvgl.widget.update:
          id: dot_motion_summary
          bg_color: !lambda |-
            int n = (id(sw_front_motion).state ? 1 : 0) + (id(sw_downstairs_motion).state ? 1 : 0);
            if (n == 2) {
              return lv_color_hex(0x14FE17);
            }
            if (n == 0) {
              return lv_color_hex(0xFFAE00);
            }
            return lv_color_hex(0x5A7A5A);

  # Top-bar battery label text + threshold colors
  # (< 15% danger #FF3333, < 30% amber #FFAE00, otherwise #E8FFE8).
  - id: update_battery_label
    mode: single
    then:
      - lvgl.label.update:
          id: topbar_battery
          text: !lambda |-
            float pct = id(battery_percent).state;
            if (isnan(pct)) {
              return std::string("--%");
            }
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return std::string(buf);
      - lvgl.widget.update:
          id: topbar_battery
          text_color: !lambda |-
            float pct = id(battery_percent).state;
            if (!isnan(pct) && pct < 15.0f) {
              return lv_color_hex(0xFF3333);
            }
            if (!isnan(pct) && pct < 30.0f) {
              return lv_color_hex(0xFFAE00);
            }
            return lv_color_hex(0xE8FFE8);

  # ---------------------------------------------------------------------------
  # SCREENSAVER + WAKE
  # ---------------------------------------------------------------------------
  - id: enter_screensaver
    mode: single
    then:
      - if:
          condition:
            lambda: return id(screensaver_active);
          then:
            - script.stop: enter_screensaver
      - globals.set:
          id: screensaver_active
          value: 'true'
      - lvgl.label.update:
          id: screensaver_clock
          text: !lambda |-
            auto t = id(panel_time).now();
            if (!t.is_valid()) {
              return std::string("--:--");
            }
            char buf[12];
            t.strftime(buf, sizeof(buf), "%I:%M %p");
            return std::string(buf);
      - lvgl.widget.update:
          id: topbar_clock
          hidden: true
      - lvgl.widget.update:
          id: topbar_date
          hidden: true
      - lvgl.widget.update:
          id: topbar_title
          hidden: true
      - lvgl.widget.update:
          id: topbar_battery
          hidden: true
      - lvgl.widget.update:
          id: nav_tabs
          hidden: true
      - lvgl.page.show: screensaver_page
      # Drive the backlight output directly; the light.turn_on brightness path
      # has not been reliably dimming on this panel.
      - output.set_level:
          id: backlight_output
          level: 25%

  - id: wake_screen
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(screensaver_active);
          then:
            - script.stop: wake_screen
      - globals.set:
          id: screensaver_active
          value: 'false'
      - output.set_level:
          id: backlight_output
          level: 100%
      - lvgl.page.show: home_page
      - lvgl.widget.update:
          id: topbar_clock
          hidden: false
      - lvgl.widget.update:
          id: topbar_date
          hidden: false
      - lvgl.widget.update:
          id: topbar_title
          hidden: false
      - lvgl.widget.update:
          id: topbar_battery
          hidden: false
      - lvgl.widget.update:
          id: nav_tabs
          hidden: false

  - id: go_home
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(screensaver_active);
          then:
            - lvgl.page.show: home_page

lvgl:
  # Idle handling: screensaver after 60s of no touch, auto-return Home after 5min.
  on_idle:
    - timeout: 60s
      then:
        - script.execute: enter_screensaver
    - timeout: 5min
      then:
        - script.execute: go_home

  # ----- Design tokens -----  (match the AI dashboard green-phosphor theme)
  #   Canvas 800x480; top bar 50px and bottom nav 50px in #0A140A.
  #   Content bg #030503, cards #1A4A1A, pressed/hover #2D7A2D,
  #   accent/active #14FE17, alert #FFAE00, danger #FF3333,
  #   text #E8FFE8 / secondary #5A7A5A, radius 8px.
  gradients:
    - id: bg_gradient
      direction: ver
      stops:
        - color: 0x0A140A
          position: 0
        - color: 0x030503
          position: 255

  style_definitions:
    - id: page_bg_style
      bg_color: 0x030503
      radius: 0
      pad_all: 0
      border_width: 0
    - id: bar_style
      bg_color: 0x0A140A
      radius: 0
      pad_all: 0
      border_width: 0
    - id: card_style
      bg_color: 0x1A4A1A
      radius: 8
      pad_all: 0
      border_width: 0
      shadow_color: 0x000000
      shadow_opa: 60%
      shadow_width: 10
      shadow_offset_x: 0
      shadow_offset_y: 4
    - id: scene_btn_style
      bg_color: 0x1A4A1A
      radius: 8
      pad_all: 0
      border_width: 0
      text_color: 0xE8FFE8
    - id: toggle_btn_style
      bg_color: 0x1A4A1A
      radius: 8
      pad_all: 0
      border_width: 0
      text_color: 0xE8FFE8

  # Shared top bar + bottom nav, drawn on LVGL's always-on-top layer so they
  # appear on every page without duplicating widgets.
  bottom_layer:
    widgets:
      - obj:
          width: 800
          height: 480
