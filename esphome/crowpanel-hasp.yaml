# =============================================================================
# CrowPanel 7" (ESP32-S3) wall panel — ESPHome + LVGL dashboard
#
# Three-page control-first dashboard: Home / Lights / Security.
# Hardware sections below the header are the PROVEN, WORKING base for this
# panel — do not "fix" display/touch/I2C/backlight/PSRAM/framework values.
#
# Before compiling:
#   1. Fill in the BATTERY ADC placeholder (pin + voltage divider) — see TODOs
#      in the sensor section.
#   2. Requires secrets: wifi_ssid, wifi_password,
#      crowpanel_hasp__encryption_key.
#   3. In Home Assistant, allow this device to make service calls:
#      Settings > Devices & services > ESPHome > CrowPanel HASP > Configure >
#      enable "Allow the device to make Home Assistant service calls".
#   4. Note: scenes were retired on this HA instance; the dashboard's scene
#      buttons call the equivalent scripts (script.all_lights_off,
#      script.relax_mode, script.movie_mode, script.goodnight).
# =============================================================================

esphome:
  name: crowpanel-hasp
  friendly_name: CrowPanel HASP
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - light.turn_on: backlight

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret crowpanel_hasp__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# State flag so screensaver/wake scripts don't fight each other.
globals:
  - id: screensaver_active
    type: bool
    restore_value: no
    initial_value: 'false'

# Embedded status/weather icons (local PNGs with alpha transparency). The
# update_weather_icon script and the door/motion state triggers swap the
# widgets' src between these IDs at runtime; no network fetch is needed.
image:
  - id: icon_lock
    file: lock_closed.png
    type: RGB
    transparency: alpha_channel
    resize: 48x48
  - id: icon_unlock
    file: lock_open.png
    type: RGB
    transparency: alpha_channel
    resize: 48x48
  - id: icon_shield
    file: shield.png
    type: RGB
    transparency: alpha_channel
    resize: 48x48
  - id: icon_warning
    file: warning.png
    type: RGB
    transparency: alpha_channel
    resize: 48x48
  - id: icon_sun
    file: sun.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_moon
    file: moon.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_partly_cloudy
    file: partly_cloudy.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_cloud
    file: cloud.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_rain
    file: rain.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_snow
    file: snow.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_thunder
    file: thunder.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80
  - id: icon_fog
    file: fog.png
    type: RGB
    transparency: alpha_channel
    resize: 80x80

  # Scene / light tile icons (rendered from MDI glyphs, 64 px source,
  # resized at the point of use).
  - id: icon_scene_all_off
    file: icon_scene_all_off.png
    type: RGB
    transparency: alpha_channel
    resize: 32x32
  - id: icon_scene_relax
    file: icon_scene_relax.png
    type: RGB
    transparency: alpha_channel
    resize: 32x32
  - id: icon_scene_movie
    file: icon_scene_movie.png
    type: RGB
    transparency: alpha_channel
    resize: 32x32
  - id: icon_scene_goodnight
    file: icon_scene_goodnight.png
    type: RGB
    transparency: alpha_channel
    resize: 32x32
  - id: icon_light_fan
    file: icon_light_fan.png
    type: RGB
    transparency: alpha_channel
    resize: 32x32

  # Background image for the Home-page weather card.
  - id: weather_bg
    file: weather_bg.png
    type: RGB
    resize: 370x150

i2c:
  sda: 15
  scl: 16
  frequency: 400000
  scan: true
  id: i2c_bus

output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: |-
          // CrowPanel Advance V1.2+ (tested on V1.4) STC8H1K28 backlight control.
          // The STC8 expects a single byte written to I2C address 0x30.
          // Scale is inverted: 0 = full brightness, 245 = off.
          // See: https://www.espboards.dev/esp32/elecrow-crowpanel-advance-7-esp32-s3/
          uint8_t brightness;
          if (state == 0.0f) {
            brightness = 0xF5;  // 245 = off
          } else {
            brightness = (uint8_t)(245.0f * (1.0f - state));
          }
          id(i2c_bus).write(0x30, &brightness, 1, true);
          ESP_LOGD("backlight", "set level %.0f%% -> 0x%02X", state * 100.0f, brightness);

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: rpi_dpi_rgb
    id: my_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: 42
    hsync_pin: 40
    vsync_pin: 41
    pclk_pin: 39
    pclk_frequency: 18MHz
    data_pins:
      red:
        - 7
        - 17
        - 18
        - 3
        - 46
      green:
        - 9
        - 10
        - 11
        - 12
        - 13
        - 14
      blue:
        - 21
        - 47
        - 48
        - 45
        - 38

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  address: 0x5D

# Clock source for the top bar and the time-of-day greeting.
time:
  - platform: homeassistant
    id: panel_time
    on_time:
      - seconds: /1
        then:
          # Top-bar clock
          - lvgl.label.update:
              id: topbar_clock
              text: !lambda |-
                auto t = id(panel_time).now();
                if (!t.is_valid()) {
                  return std::string("--:--");
                }
                char buf[12];
                t.strftime(buf, sizeof(buf), "%I:%M %p");
                return std::string(buf);
          # Top-bar date
          - lvgl.label.update:
              id: topbar_date
              text: !lambda |-
                auto t = id(panel_time).now();
                if (!t.is_valid()) {
                  return std::string("--- --");
                }
                char buf[16];
                t.strftime(buf, sizeof(buf), "%a %b %d");
                return std::string(buf);
          # Screensaver clock
          - lvgl.label.update:
              id: screensaver_clock
              text: !lambda |-
                auto t = id(panel_time).now();
                if (!t.is_valid()) {
                  return std::string("--:--");
                }
                char buf[12];
                t.strftime(buf, sizeof(buf), "%I:%M %p");
                return std::string(buf);
          # Time-of-day greeting on the Home page
          - lvgl.label.update:
              id: home_greeting
              text: !lambda |-
                auto t = id(panel_time).now();
                if (!t.is_valid()) {
                  return std::string("Hello");
                }
                int h = t.hour;
                if (h < 5) {
                  return std::string("Good night");
                } else if (h < 12) {
                  return std::string("Good morning");
                } else if (h < 18) {
                  return std::string("Good afternoon");
                } else {
                  return std::string("Good evening");
                }

font:
  - file:
      type: gfonts
      family: Roboto
    id: font_small
    size: 14
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
    id: font_medium
    size: 22
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
    id: font_large
    size: 36
    bpp: 4

sensor:
  # ---------------------------------------------------------------------------
  # BATTERY — PLACEHOLDER, NEEDS HARDWARE DETAILS
  #
  # A LiPo battery was added to the panel, but the ADC GPIO and the voltage
  # divider values are not yet known. TWO values must be filled in below:
  #
  #   TODO 1: `pin:`        — the GPIO the battery voltage divider output is
  #                           wired to. MUST be an ADC1 pin (GPIO1..GPIO10 on
  #                           the ESP32-S3) because ADC2 cannot be used
  #                           alongside Wi-Fi. GPIO4 (ADC1_CH3) is a guess and
  #                           is free on this panel's pin map — change it.
  #   TODO 2: divider ratio  — the lambda filter on the adc sensor must multiply
  #                           the measured voltage back up by the divider ratio,
  #                           e.g. `return x * 2.0f;` for a 100k/100k divider.
  #
  # Percentage mapping (3.0 V -> 0%, 4.2 V -> 100%, clamped) is implemented in
  # the template sensor `battery_percent` below and needs no changes.
  # ---------------------------------------------------------------------------
  - platform: adc
    pin: GPIO4  # TODO: confirm the actual battery divider pin (must be ADC1)
    attenuation: 12db
    id: battery_voltage
    name: "Panel battery voltage"
    update_interval: 30s
    filters:
      - lambda: |-
          // TODO: apply the voltage divider ratio here, e.g.:
          // return x * 2.0f;   // 100k/100k divider
          return x;
    on_value:
      then:
        - script.execute: update_battery_label

  - platform: template
    name: "Panel battery"
    id: battery_percent
    unit_of_measurement: "%"
    update_interval: 30s
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) {
        return NAN;
      }
      // 3.0 V -> 0%, 4.2 V -> 100%, clamped to 0-100.
      float pct = (v - 3.0f) / (4.2f - 3.0f) * 100.0f;
      if (pct < 0.0f) {
        pct = 0.0f;
      }
      if (pct > 100.0f) {
        pct = 100.0f;
      }
      return pct;
    on_value:
      then:
        - script.execute: update_battery_label

  # ----- Home Assistant imports: numeric values -----
  - platform: homeassistant
    id: ha_weather_temp
    entity_id: weather.forecast_home
    attribute: temperature
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: home_weather_temp
            text:
              format: "%.0f°"
              args: ['x']
              if_nan: "--°"

  - platform: homeassistant
    id: ha_backup_age
    entity_id: sensor.ha_last_backup_age
    internal: true

    on_value:
      then:
        - script.execute: update_alert_banner

  - platform: homeassistant
    id: ha_disk_usage
    entity_id: sensor.ha_disk_usage
    internal: true

    on_value:
      then:
        - script.execute: update_alert_banner

  - platform: homeassistant
    id: ha_nws_alerts
    entity_id: sensor.nws_warnings_watches
    internal: true

    on_value:
      then:
        - script.execute: update_alert_banner

  # Living room ceiling fan brightness (0-255), used to position the slider.
  - platform: homeassistant
    id: ha_lr_fan_brightness
    entity_id: light.living_room_ceiling_fan
    attribute: brightness
    internal: true

    on_value:
      then:
        - lvgl.slider.update:
            id: lr_fan_slider
            value: !lambda |-
              if (isnan(x) || x <= 0.0f) {
                return 0;
              }
              return (int) (x / 255.0f * 100.0f);
        - lvgl.label.update:
            id: lr_fan_pct
            text: !lambda |-
              if (isnan(x) || x <= 0.0f) {
                return std::string("--%");
              }
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int)(x / 255.0f * 100.0f));
              return std::string(buf);

  # Office ceiling fan brightness (0-255), used to position the slider.
  - platform: homeassistant
    id: ha_office_fan_brightness
    entity_id: light.ceiling_fan
    attribute: brightness
    internal: true

    on_value:
      then:
        - lvgl.slider.update:
            id: office_fan_slider
            value: !lambda |-
              if (isnan(x) || x <= 0.0f) {
                return 0;
              }
              return (int) (x / 255.0f * 100.0f);
        - lvgl.label.update:
            id: office_fan_pct
            text: !lambda |-
              if (isnan(x) || x <= 0.0f) {
                return std::string("--%");
              }
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int)(x / 255.0f * 100.0f));
              return std::string(buf);

  # Weather humidity and wind speed.
  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: weather.forecast_home
    attribute: humidity
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: home_weather_humidity
            text:
              format: "Hum: %.0f%%"
              args: ['x']
              if_nan: "Hum: --"

  - platform: homeassistant
    id: ha_weather_wind
    entity_id: weather.forecast_home
    attribute: wind_speed
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: home_weather_wind
            text:
              format: "Wind: %.0f"
              args: ['x']
              if_nan: "Wind: --"

  # ---------------------------------------------------------------------------
  # Room climate sensors (temperature + humidity)
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: ha_climate_living_temp
    entity_id: sensor.hobeian_zg_204zx_temperature_4
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_living_temp
            text:
              format: "%.1f°"
              args: ['x']
              if_nan: "--°"

  - platform: homeassistant
    id: ha_climate_living_hum
    entity_id: sensor.hobeian_zg_204zx_humidity_4
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_living_hum
            text:
              format: "%.0f%%"
              args: ['x']
              if_nan: "--%"

  - platform: homeassistant
    id: ha_climate_bedroom_temp
    entity_id: sensor.hobeian_zg_204zx_temperature_2
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_bedroom_temp
            text:
              format: "%.1f°"
              args: ['x']
              if_nan: "--°"

  - platform: homeassistant
    id: ha_climate_bedroom_hum
    entity_id: sensor.hobeian_zg_204zx_humidity_2
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_bedroom_hum
            text:
              format: "%.0f%%"
              args: ['x']
              if_nan: "--%"

  - platform: homeassistant
    id: ha_climate_office_temp
    entity_id: sensor.hobeian_zg_204zx_temperature_3
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_office_temp
            text:
              format: "%.1f°"
              args: ['x']
              if_nan: "--°"

  - platform: homeassistant
    id: ha_climate_office_hum
    entity_id: sensor.hobeian_zg_204zx_humidity_3
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_office_hum
            text:
              format: "%.0f%%"
              args: ['x']
              if_nan: "--%"

  - platform: homeassistant
    id: ha_climate_basement_temp
    entity_id: sensor.hobeian_zg_204zx_temperature
    internal: true

    on_value:
      then:
        - lvgl.label.update:
            id: climate_basement_temp
