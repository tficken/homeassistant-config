              - label:
                  id: home_door_front
                  x: 14
                  y: 34
                  width: 340
                  text_font: font_medium
                  text_color: 0x5A7A5A
                  text: "Front Door: --"
              - label:
                  id: home_door_back
                  x: 14
                  y: 62
                  width: 340
                  text_font: font_medium
                  text_color: 0x5A7A5A
                  text: "Back Door: --"
              - label:
                  id: home_motion_summary
                  x: 14
                  y: 90
                  width: 340
                  text_font: font_medium
                  text_color: 0x5A7A5A
                  text: "Motion armed: --"

        # Alert banner (visible only when at least one alert is active).
        - obj:
            id: alert_banner
            x: 20
            y: 332
            width: 760
            height: 72
            bg_color: 0xFFAE00
            radius: 8
            pad_all: 0
            border_width: 0
            clickable: false
            hidden: true
            widgets:
              - label:
                  id: alert_banner_text
                  align: CENTER
                  width: 732
                  text_align: CENTER
                  text_font: font_medium
                  text_color: 0x081208
                  text: Alerts

    # =========================================================================
    # PAGE 2 — LIGHTS & SCENES
    # =========================================================================
    - id: lights_page
      widgets:
        - obj:
            styles: page_bg_style
            x: 0
            y: 0
            width: 800
            height: 480
            clickable: false

        - label:
            x: 20
            y: 58
            text_font: font_small
            text_color: 0x5A7A5A
            text: SCENES
        # Scene grid (2x2). Scenes are retired on this HA instance, so the
        # equivalent scripts are called instead.
        - button:
            styles: scene_btn_style
            pressed:
              bg_color: 0x14FE17
              text_color: 0x081208
            x: 20
            y: 82
            width: 170
            height: 64
            text: ALL OFF
            on_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: script.all_lights_off
        - button:
            styles: scene_btn_style
            pressed:
              bg_color: 0x14FE17
              text_color: 0x081208
            x: 206
            y: 82
            width: 170
            height: 64
            text: RELAX
            on_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: script.relax_mode
        - button:
            styles: scene_btn_style
