              bg_color: 0x14FE17
              text_color: 0x081208
            x: 206
            y: 154
            width: 170
            height: 64
            text: GOODNIGHT
            on_click:
              - homeassistant.service:
                  service: script.turn_on
                  data:
                    entity_id: script.goodnight

        - label:
            x: 410
            y: 58
            text_font: font_small
            text_color: 0x5A7A5A
            text: LIGHTS

        # Living Room Ceiling Fan: toggle + brightness slider.
        - obj:
            styles: card_style
            x: 410
            y: 82
            width: 370
            height: 96
            clickable: false
            widgets:
              - button:
                  id: lr_fan_btn
                  styles: toggle_btn_style
                  checkable: true
                  checked:
                    bg_color: 0x14FE17
                    text_color: 0x081208
                  pressed:
                    bg_color: 0x2D7A2D
                    text_color: 0xE8FFE8
                  x: 0
                  y: 0
                  width: 370
                  height: 44
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.living_room_ceiling_fan
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 14
                        text_font: font_medium
                        text: Living Room Fan
                    - label:
                        id: lr_fan_state
                        align: RIGHT_MID
                        x: -14
                        text_font: font_medium
                        text: —
              - slider:
                  id: lr_fan_slider
                  x: 14
                  y: 52
                  width: 342
                  height: 30
                  min_value: 0
                  max_value: 100
                  adv_hittest: true
                  bg_color: 0x0A140A
                  radius: 8
                  border_width: 0
                  indicator:
                    bg_color: 0x14FE17
                    radius: 8
                  knob:
                    bg_color: 0xE8FFE8
                    radius: 12
                  on_release:
                    - homeassistant.service:
                        service: light.turn_on
                        data:
                          entity_id: light.living_room_ceiling_fan
                          brightness_pct: !lambda return int(x);

        # Office ceiling fan group: toggle + brightness slider.
        - obj:
