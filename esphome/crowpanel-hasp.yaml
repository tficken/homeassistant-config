        - obj:
            styles: page_bg_style
            x: 0
            y: 0
            width: 800
            height: 480
            clickable: false

        - label:
            id: home_greeting
            x: 20
            y: 58
            text_font: font_large
            text_color: 0xE8FFE8
            text: Hello

        - label:
            id: home_travis
            x: 20
            y: 108
            text_font: font_medium
            text_color: 0x5A7A5A
            text: "Travis: --"
        - label:
            id: home_bobbie
            x: 20
            y: 134
            text_font: font_medium
            text_color: 0x5A7A5A
            text: "Bobbie: --"

        # Weather card
        - obj:
            styles: card_style
            x: 20
            y: 170
            width: 370
            height: 150
            clickable: false
            widgets:
              - label:
                  x: 14
                  y: 10
                  text_font: font_small
                  text_color: 0x5A7A5A
                  text: WEATHER
              - label:
                  id: home_weather_temp
                  x: 14
                  y: 34
                  width: 200
                  text_align: LEFT
                  text_font: font_large
                  text_color: 0xE8FFE8
                  text: --°
              - label:
                  id: home_weather_cond
                  x: 14
