schema: 1
id: us.capitalone.credit_card
version: 1

metadata:
  name: Capital One credit card
  country: US
  language: en
  provider: Capital One
  bill_type: credit_card
  homepage: https://www.capitalone.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0

prefilter:
  email:
    from:
      - capitalone@notification.capitalone.com
    subject_contains:
      - payment is due

detection:
  threshold: 70
  rules:
    - source: email.from
      equals: capitalone@notification.capitalone.com
      weight: 60
    - source: email.subject
      regex: '(?i)^Your\s+credit\s+card\s+payment\s+is\s+due'
      weight: 35
    - source: email.body
      regex: '(?i)remaining\s+balance\s+of'
      weight: 20

documents:
  email:
    enabled: true
  attachments: []

fields:
  provider:
    value: Capital One

  bill_type:
    value: credit_card

  currency:
    value: USD

  # What actually leaves the account: the scheduled AutoPay amount
  # ("$35.00 (AutoPay)"). Falls back to the statement remaining balance
  # ("remaining balance of $1,343.42") if the AutoPay line is absent.
  amount:
    required: true
    candidates:
      - source: email
        regex: '(?i)\$\s*(?P<value>[0-9,]+\.[0-9]{2})\s*\(AutoPay\)'
      - source: email
        regex: '(?i)remaining\s+balance\s+of\s+\$\s*(?P<value>[0-9,]+\.[0-9]{2})'
    transform:
      type: decimal
      locale: en_US

  due_date:
    required: true
    candidates:
      - source: email
        regex: '(?i)payment\s+is\s+due\s+on\s+(?P<value>[A-Z][a-z]{2}\.\s+\d{1,2},\s+\d{4})'
      - source: email
        regex: '(?i)due\s+(?:date|on)[:\s]*(?P<value>[A-Z][a-z]+\.?\s+\d{1,2},\s+\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%b. %d, %Y'
        - '%B %d, %Y'
