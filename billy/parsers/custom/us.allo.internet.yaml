schema: 1
id: us.allo.internet
version: 1

metadata:
  name: ALLO Fiber
  country: US
  language: en
  provider: ALLO
  bill_type: internet
  homepage: https://www.allocommunications.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0

prefilter:
  email:
    from:
      - allo-noreply@smarthub.coop
    subject_contains:
      - ALLO bill is available

detection:
  threshold: 70
  rules:
    - source: email.from
      equals: allo-noreply@smarthub.coop
      weight: 60
    - source: email.subject
      regex: '(?i)^Your\s+ALLO\s+bill\s+is\s+available'
      weight: 35
    - source: email.body
      regex: '(?i)account\s+number\s+of'
      weight: 20

documents:
  email:
    enabled: true
  attachments: []

fields:
  provider:
    value: ALLO

  bill_type:
    value: internet

  currency:
    value: USD

  amount:
    required: true
    candidates:
      - source: email
        regex: '(?i)amount\s+of\s+\$\s*(?P<value>[0-9,]+\.[0-9]{2})'
      - source: email
        regex: '(?i)\$\s*(?P<value>[0-9,]+\.[0-9]{2})\s*\n?\s*due\s+on'
    transform:
      type: decimal
      locale: en_US

  due_date:
    candidates:
      - source: email
        regex: '(?i)is\s+due\s+(?P<value>[A-Za-z]+\s+\d{1,2},\s*\d{4})'
      - source: email
        regex: '(?i)due\s+on\s+(?P<value>[A-Za-z]+\s+\d{1,2})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%b %d, %Y'
        - '%B %d, %Y'

  customer_code:
    candidates:
      - source: email
        regex: '(?i)account\s+number\s+of\s+(?P<value>\d+)'
    transform:
      type: text
