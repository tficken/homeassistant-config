schema: 1
id: us.merrickbank.credit_card
version: 1

metadata:
  name: Merrick Bank credit card
  country: US
  language: en
  provider: Merrick Bank
  bill_type: credit_card
  homepage: https://www.merrickbank.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0

prefilter:
  email:
    from:
      - customerservice@merrickbank.com
    subject_contains:
      - statement is here

# Same sender also mails "payment is due soon" and "payment has posted" —
# the subject regex anchors on "statement is here". Note Ollo (also
# Merrick-issued) uses a different sender, so the two never collide.
detection:
  threshold: 70
  rules:
    - source: email.from
      equals: customerservice@merrickbank.com
      weight: 60
    - source: email.subject
      regex: '(?i)^Your\s+statement\s+is\s+here'
      weight: 35
    - source: email.body
      regex: '(?i)latest\s+Merrick\s+credit\s+card\s+account\s+statement'
      weight: 20

documents:
  email:
    enabled: true
  attachments: []

fields:
  provider:
    value: Merrick Bank

  bill_type:
    value: credit_card

  currency:
    value: USD

  # Body layout is tab-separated: "Minimum Amount Due\t$35.00".
  # Falls back to Statement Balance if the minimum line is absent.
  amount:
    required: true
    candidates:
      - source: email
        regex: '(?i)Minimum\s+Amount\s+Due\s*\$\s*(?P<value>[0-9,]+\.[0-9]{2})'
      - source: email
        regex: '(?i)Statement\s+Balance\s*\$\s*(?P<value>[0-9,]+\.[0-9]{2})'
    transform:
      type: decimal
      locale: en_US

  due_date:
    required: true
    candidates:
      - source: email
        regex: '(?i)Payment\s+Due\s+Date\s*(?P<value>\d{1,2}/\d{1,2}/\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%m/%d/%Y'

  customer_code:
    candidates:
      - source: email
        regex: '(?i)Credit\s+Card\s+Ending\s+in\s+(?P<value>\d{4})'
    transform:
      type: text
