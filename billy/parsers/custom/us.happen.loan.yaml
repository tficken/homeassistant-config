schema: 1
id: us.happen.loan
version: 1

metadata:
  name: Happen Bank loan (formerly LendingClub)
  country: US
  language: en
  provider: Happen Bank
  bill_type: loan
  homepage: https://www.happen.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0

prefilter:
  email:
    from:
      - payments@mail6.lendingclub.com
    subject_contains:
      - loan payment is due soon

# Same sender may mail other payment reminders; subject anchors on the
# monthly "next loan payment is due soon" notice.
detection:
  threshold: 70
  rules:
    - source: email.from
      equals: payments@mail6.lendingclub.com
      weight: 60
    - source: email.subject
      regex: '(?i)^Your\s+next\s+loan\s+payment\s+is\s+due\s+soon'
      weight: 35
    - source: email.body
      regex: '(?i)scheduled\s+payment\s+is\s+coming\s+up'
      weight: 20

documents:
  email:
    enabled: true
  attachments: []

fields:
  provider:
    value: Happen Bank

  bill_type:
    value: loan

  currency:
    value: USD

  # Body layout: "Next payment:\t$388.02" / "Next payment date:\tOctober 14, 2026"
  amount:
    required: true
    candidates:
      - source: email
        regex: '(?i)Next\s+payment:\s*\$\s*(?P<value>[0-9,]+\.[0-9]{2})'
    transform:
      type: decimal
      locale: en_US

  due_date:
    required: true
    candidates:
      - source: email
        regex: '(?i)Next\s+payment\s+date:\s*(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%B %d, %Y'

  customer_code:
    candidates:
      - source: email
        regex: '(?i)Loan\s+number\s+ending\s+in:\s*(?P<value>\d{4})'
    transform:
      type: text
