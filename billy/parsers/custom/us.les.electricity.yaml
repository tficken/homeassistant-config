schema: 1
id: us.les.electricity
version: 1

metadata:
  name: LES (Lincoln Electric System)
  country: US
  language: en
  provider: LES
  bill_type: electricity
  homepage: https://www.les.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0

# Privacy-first: evaluated only against IMAP metadata; the body is fetched
# only when the sender/subject match.
prefilter:
  email:
    from:
      - noreply@les.com
    subject_contains:
      - bill is available

detection:
  threshold: 70
  rules:
    - source: email.from
      equals: noreply@les.com
      weight: 60
    - source: email.subject
      regex: '(?i)^Your\s+LES\s+Bill\s+is\s+Available'
      weight: 35
    - source: email.body
      regex: '(?i)\bLincoln\s+Electric\s+System\b'
      weight: 20

documents:
  email:
    enabled: true
  attachments: []

fields:
  provider:
    value: LES

  bill_type:
    value: electricity

  currency:
    value: USD

  # Multiple candidate patterns per field — first match wins. Adjust these
  # against the real email body wording.
  amount:
    required: true
    candidates:
      - source: email
        regex: '(?i)Amount\s+Due[:\s]*\$\s*(?P<value>[0-9,]+\.[0-9]{2})'
      - source: email
        regex: '(?i)\$\s*(?P<value>[0-9,]+\.[0-9]{2})\s+(?:is\s+)?due'
    transform:
      type: decimal
      locale: en_US

  due_date:
    candidates:
      - source: email
        regex: '(?i)Due\s+Date[:\s]*(?P<value>\d{1,2}/\d{1,2}/\d{4})'
      - source: email
        regex: '(?i)due\s+(?:by\s+)?(?:on\s+)?(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
      - source: email
        regex: '(?i)due\s+(?:by\s+)?(?:on\s+)?(?P<value>\d{1,2}/\d{1,2}/\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%m/%d/%Y'
        - '%B %d, %Y'

  # Optional — used for dedup when present. LES emails usually carry the
  # account number; a per-bill invoice number may not exist in the body.
  invoice_number:
    candidates:
      - source: email
        regex: '(?i)(?:Invoice|Statement)\s*(?:Number|#|No\.?)[:\s]*(?P<value>[A-Z0-9-]+)'
    transform:
      type: text

  customer_code:
    candidates:
      - source: email
        regex: '(?i)Account\s*(?:Number|#|No\.?)[:\s]*(?P<value>[0-9-]+)'
    transform:
      type: text
