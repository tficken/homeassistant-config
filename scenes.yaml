# Scenes for common lighting/media presets.
# Kept alongside the existing scripts so dashboard tiles, voice exposure, and
# automations that reference the scripts continue to work.

- id: movie_mode
  name: Movie mode
  icon: mdi:movie-open
  entities:
    light.third_reality_inc_3rcb01057z:
      state: "off"
    light.third_reality_inc_3rcb01057z_2:
      state: "off"
    light.third_reality_inc_3rcb01057z_3:
      state: "off"
    light.ceiling_fan:
      state: "off"
    light.p1s_01p00a412300832_chamber_light:
      state: "off"
    light.travis_office_p1s_uno_chamber_light:
      state: "off"

- id: focus_mode
  name: Focus mode
  icon: mdi:desk-lamp-on
  entities:
    light.third_reality_inc_3rcb01057z:
      state: "on"
      brightness_pct: 100
    light.third_reality_inc_3rcb01057z_2:
      state: "on"
      brightness_pct: 100
    light.third_reality_inc_3rcb01057z_3:
      state: "on"
      brightness_pct: 100
    light.ceiling_fan:
      state: "on"
      brightness_pct: 100

- id: relax_mode
  name: Relax mode
  icon: mdi:sofa
  entities:
    light.third_reality_inc_3rcb01057z:
      state: "on"
      brightness_pct: 30
    light.third_reality_inc_3rcb01057z_2:
      state: "on"
      brightness_pct: 30
    light.third_reality_inc_3rcb01057z_3:
      state: "on"
      brightness_pct: 30
    light.ceiling_fan:
      state: "on"
      brightness_pct: 30

- id: all_lights_off
  name: All lights off
  icon: mdi:lightbulb-off
  entities:
    light.ceiling_fan:
      state: "off"
    light.third_reality_inc_3rcb01057z:
      state: "off"
    light.third_reality_inc_3rcb01057z_2:
      state: "off"
    light.third_reality_inc_3rcb01057z_3:
      state: "off"
    light.p1s_01p00a412300832_chamber_light:
      state: "off"
    light.travis_office_p1s_uno_chamber_light:
      state: "off"

- id: living_room_focus_mode
  name: Living room focus mode
  icon: mdi:desk-lamp-on
  entities:
    light.living_room_ceiling_fan:
      state: "on"
      brightness_pct: 100

- id: living_room_relax_mode
  name: Living room relax mode
  icon: mdi:sofa
  entities:
    light.living_room_ceiling_fan:
      state: "on"
      brightness_pct: 30

- id: living_room_all_lights_off
  name: Living room all lights off
  icon: mdi:lightbulb-off
  entities:
    light.living_room_ceiling_fan:
      state: "off"
