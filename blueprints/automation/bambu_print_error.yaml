blueprint:
  name: Bambu print error notification
  description: >-
    Send a persistent notification and a mobile-app notification when a Bambu
    printer reports a print status error or a print/HMS error binary sensor
    turns on.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    printer_name:
      name: Printer display name
      description: Short name used in notification titles and messages.
      default: P1S
      selector:
        text:
    print_status_entity:
      name: Print status sensor
      default: sensor.p1s_01p00a412300832_print_status
      selector:
        entity:
          filter:
            domain: sensor
    error_binary_sensors:
      name: Error binary sensors
      description: Print-error and HMS-error binary sensors that trigger when they turn on.
      default:
        - binary_sensor.p1s_01p00a412300832_print_error
        - binary_sensor.p1s_01p00a412300832_hms_errors
      selector:
        entity:
          multiple: true
          filter:
            domain: binary_sensor
    notification_id:
      name: Persistent notification ID
      default: bambu_p1s_print_error
      selector:
        text:
    notify_service:
      name: Mobile notify action
      description: notify.* action used for the mobile push notification.
      default: notify.mobile_app_traviss_iphone
      selector:
        text:

mode: single

variables:
  printer_name: !input printer_name

triggers:
  - trigger: state
    entity_id:
      - !input print_status_entity
    to:
      - failed
      - error
      - fault
  - trigger: state
    entity_id: !input error_binary_sensors
    to: "on"

conditions:
  - condition: template
    value_template: >
      {{ trigger.to_state is not none and
         ((trigger.to_state.state | lower) in ['failed', 'error', 'fault'] or
          (trigger.to_state.state | lower) == 'on' and
          trigger.entity_id.startswith('binary_sensor.')) }}

actions:
  - action: persistent_notification.create
    data:
      title: "{{ printer_name }} print error"
      message: "{{ printer_name }} reported an error ({{ trigger.entity_id }}: {{ trigger.to_state.state }})."
      notification_id: !input notification_id
  - action: !input notify_service
    data:
      title: "{{ printer_name }} print error"
      message: "{{ printer_name }} reported an error ({{ trigger.entity_id }}: {{ trigger.to_state.state }})."
